<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
/* Visualizations: no box, blend into the page; only controls + figure stay visible */
.viz { margin: 1.6em 0; max-width: 100%; }
.viz svg { max-width: 680px; width: 100%; height: auto; display: block; margin: 0 auto; }
.viz div[style*="letter-spacing: 1px"],   /* title */
.viz div[style*="font-size: 11px"],       /* captions, legends */
.viz div[style*="border-top"],            /* stat footers */
.viz div[style*="border-left"] { display: none !important; }  /* explanatory notes */
.viz button { cursor: pointer; }
</style>
<style>
/* land a little above a cross-referenced box, clear of the top bar */
[id] { scroll-margin-top: 4.5rem; }
</style>
<script>
/* Keep a linked box (#r-9-4 etc.) at the top while math and figures above it finish rendering. */
(function () {
  var stop = false, until = 0;
  function target() {
    var h = decodeURIComponent(location.hash.slice(1));
    return h ? document.getElementById(h) : null;
  }
  function pin() {
    if (stop || Date.now() > until) return;
    var el = target(); if (!el) return;
    var off = el.getBoundingClientRect().top - 72;
    if (Math.abs(off) > 2) window.scrollBy(0, off);
  }
  function arm() {
    stop = false; until = Date.now() + 4000;
    pin();
    var ticks = 0, t = setInterval(function () { pin(); if (++ticks > 40 || stop) clearInterval(t); }, 100);
  }
  ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) {
    window.addEventListener(ev, function () { stop = true; }, { passive: true });
  });
  window.addEventListener("hashchange", arm);
  window.addEventListener("load", function () { if (location.hash) arm(); });
  document.addEventListener("DOMContentLoaded", function () {
    if (location.hash) arm();
    if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(pin);
  });
})();
</script>
<style>
/* top bar: gravitational-wave banner instead of the flat purple */

}
</style>

#quarto-sidebar .sidebar-link, #quarto-sidebar .menu-text, #quarto-sidebar .chapter-title {
  white-space: normal !important; overflow-wrap: anywhere; }
#quarto-sidebar .sidebar-link .menu-text { display: flex; gap: 0.35em; line-height: 1.3; }
#quarto-sidebar .chapter-number { flex: none; }
@media (max-width: 991.98px) {
  #quarto-sidebar { max-width: 100vw; overflow-x: hidden; font-size: 0.95rem; }
  #quarto-sidebar .sidebar-menu-container { padding-right: 0.8rem; }
  /* the bar under the banner: one line, cut off with … */
  .quarto-secondary-nav .quarto-page-breadcrumbs, .quarto-secondary-nav nav { min-width: 0; flex: 1 1 auto; overflow: hidden; }
  .quarto-secondary-nav .breadcrumb { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; margin: 0; }
  .quarto-secondary-nav .breadcrumb-item { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .quarto-secondary-nav .breadcrumb-item:not(:last-child) { display: none; }
  .quarto-secondary-nav .breadcrumb-item + .breadcrumb-item::before { display: none; }
  .navbar-brand .navbar-title { white-space: normal; }
  h1.title, .quarto-title h1 { overflow-wrap: break-word; }
}
