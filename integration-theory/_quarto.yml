project:
  type: book
  output-dir: _book
  pre-render: _graph.py
  resources:
    - images/
    - lecture-graph.js

book:
  title: "Integration Theory"
  site-url: "https://tresnjo.github.io/lecture-notes/integration-theory/"
  subtitle: "Lecture Notes"
  author: ""           # ← add your name here
  date: last-modified
  date-format: "MMMM D, YYYY"
  search: true

  navbar:
    background: "#1e1b4b"
    foreground: white

  sidebar:
    style: "docked"
    search: true

  chapters:
    - index.qmd
    - part: "Measure Theory"
      chapters:
        - lecture-01.qmd
        - lecture-02.qmd
        - lecture-03.qmd
        - lecture-04.qmd
    - part: "Integration"
      chapters:
        - lecture-05.qmd
        - lecture-06.qmd
        - lecture-07.qmd
        - lecture-08.qmd
        - lecture-09.qmd
    - part: "Signed Measures and Differentiation"
      chapters:
        - lecture-10.qmd
        - lecture-11.qmd
        - lecture-12.qmd
        - lecture-13.qmd
        - lecture-14.qmd
        - lecture-15.qmd
    - book-index.qmd

language:
  title-block-published: "Last edited"

format:
  html:
    respect-user-color-scheme: true
    theme:
      light: [flatly, custom.scss]
      dark:  [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 1
    smooth-scroll: true
    html-math-method: mathjax
    include-in-header: react-header.html
    callout-icon: false
    reference-location: margin
    citation-location: margin
    grid:
      sidebar-width: 260px
      body-width: 780px
      margin-width: 310px
      gutter-width: 1.8rem


execute:
  freeze: auto
