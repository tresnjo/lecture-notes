<script>
'use strict';
const { useState, useEffect, useRef } = React;
const h = React.createElement;

// Theme colours accessible to components
const AC = '#877B31', ACL = '#b5a54a';

function Btn({onClick, children, active, style}) {
  return h('button', {onClick, className: 'btn' + (active?' active':''), style}, children);
}

// ── CantorSet ──────────────────────────────────────────────────────────────
function CantorSet() {
  const [lvl, setLvl] = useState(3);
  function segs(n) {
    if (n === 0) return [[0,1]];
    return segs(n-1).flatMap(([a,b]) => { const t=(b-a)/3; return [[a,a+t],[b-t,b]]; });
  }
  const W=520, R=22, PX=20;
  const rows = Array.from({length:lvl+1},(_,i)=>i);
  const svgH = (lvl+1)*R + 8;
  return h('div', null,
    h('svg', {viewBox:`0 0 ${W} ${svgH}`, style:{width:'100%',maxWidth:W,display:'block',margin:'0 auto'}},
      rows.flatMap(n => segs(n).map(([a,b],i) =>
        h('rect', {key:`${n}-${i}`, x:a*(W-2*PX)+PX, y:n*R+2, width:Math.max(0,(b-a)*(W-2*PX)), height:R-6, fill:AC, rx:1.5})
      ))
    ),
    h('div',{style:{display:'flex',gap:10,marginTop:10,justifyContent:'center',alignItems:'center'}},
      h(Btn,{onClick:()=>setLvl(Math.max(0,lvl-1))},'−'),
      h('span',{style:{fontSize:12,color:'var(--text-muted)'}},`Level ${lvl} (${Math.pow(2,lvl)} segments)`),
      h(Btn,{onClick:()=>setLvl(Math.min(7,lvl+1))},'+')
    )
  );
}

// ── DevilsStaircase ────────────────────────────────────────────────────────
function DevilsStaircase() {
  const [lvl, setLvl] = useState(4);
  function cv(x, n) {
    if (n===0) return x;
    if (x<1/3) return cv(3*x,n-1)/2;
    if (x>2/3) return 0.5+cv(3*x-2,n-1)/2;
    return 0.5;
  }
  const W=520, H=280, PX=44, PY=28;
  const iW=W-2*PX, iH=H-2*PY;
  const N=600;
  const pts = Array.from({length:N+1},(_,i)=>{
    const x=i/N; const y=cv(x,lvl);
    return `${i===0?'M':'L'}${(PX+x*iW).toFixed(1)},${(PY+(1-y)*iH).toFixed(1)}`;
  }).join(' ');
  const grid = [[1/3,'⅓'],[2/3,'⅔']];
  return h('div',null,
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',maxWidth:W,display:'block',margin:'0 auto'}},
      grid.map(([v,lbl])=>[
        h('line',{key:'gx'+v,x1:PX+v*iW,y1:PY,x2:PX+v*iW,y2:PY+iH,stroke:'var(--border)',strokeWidth:1,strokeDasharray:'3,3'}),
        h('text',{key:'tx'+v,x:PX+v*iW,y:PY+iH+14,textAnchor:'middle',fontSize:10,fill:'var(--text-muted)'},lbl)
      ]),
      h('line',{x1:PX,y1:PY,x2:PX,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      h('line',{x1:PX,y1:PY+iH,x2:PX+iW,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      h('line',{x1:PX,y1:PY+iH/2,x2:PX+iW,y2:PY+iH/2,stroke:'var(--border)',strokeWidth:1,strokeDasharray:'3,3'}),
      h('text',{x:PX-5,y:PY+iH/2+4,textAnchor:'end',fontSize:10,fill:'var(--text-muted)'},'½'),
      h('text',{x:PX-5,y:PY+4,textAnchor:'end',fontSize:10,fill:'var(--text-muted)'},'1'),
      h('path',{d:pts,fill:'none',stroke:AC,strokeWidth:2})
    ),
    h('div',{style:{display:'flex',gap:10,marginTop:10,justifyContent:'center',alignItems:'center'}},
      h(Btn,{onClick:()=>setLvl(Math.max(1,lvl-1))},'− precision'),
      h('span',{style:{fontSize:12,color:'var(--text-muted)'}},`n = ${lvl}`),
      h(Btn,{onClick:()=>setLvl(Math.min(9,lvl+1))},'+  precision')
    )
  );
}

// ── ShiftedCantor ──────────────────────────────────────────────────────────
function ShiftedCantor() {
  const [lvl, setLvl] = useState(4);
  const [alpha, setAlpha] = useState(0);
  function cv(x, n) {
    if (x<=0) return 0; if (x>=1) return 1;
    if (n===0) return x;
    if (x<1/3) return cv(3*x,n-1)/2;
    if (x>2/3) return 0.5+cv(3*x-2,n-1)/2;
    return 0.5;
  }
  const W=520, H=270, PX=44, PY=26;
  const iW=W-2*PX, iH=H-2*PY;
  const N=500;
  const pts = Array.from({length:N+1},(_,i)=>{
    const x=i/N; const val=cv(x-alpha, lvl);
    return `${i===0?'M':'L'}${(PX+x*iW).toFixed(1)},${(PY+(1-val)*iH).toFixed(1)}`;
  }).join(' ');
  return h('div',null,
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',maxWidth:W,display:'block',margin:'0 auto'}},
      h('line',{x1:PX,y1:PY,x2:PX,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      h('line',{x1:PX,y1:PY+iH,x2:PX+iW,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      h('path',{d:pts,fill:'none',stroke:AC,strokeWidth:2}),
      h('text',{x:W/2,y:H-6,textAnchor:'middle',fontSize:11,fill:'var(--text-muted)'},`F_C(x − ${alpha.toFixed(2)})`)
    ),
    h('div',{style:{marginTop:10}},
      h('div',{style:{display:'flex',gap:10,marginBottom:6,alignItems:'center',justifyContent:'center'}},
        h(Btn,{onClick:()=>setLvl(Math.max(1,lvl-1))},'− n'),
        h('span',{style:{fontSize:12,color:'var(--text-muted)'}},`n=${lvl}`),
        h(Btn,{onClick:()=>setLvl(Math.min(8,lvl+1))},'+  n')
      ),
      h('label',{style:{fontSize:12,color:'var(--text-muted)',display:'block',marginBottom:3}},`α = ${alpha.toFixed(2)}`),
      h('input',{type:'range',min:-100,max:100,value:Math.round(alpha*100),
        onInput:ev=>setAlpha(+ev.target.value/100),style:{width:'100%'}})
    )
  );
}

// ── CantorDensityViz ───────────────────────────────────────────────────────
function CantorDensityViz() {
  const [slider, setSlider] = useState(500);
  function cantorFrac(r, n) {
    // sum of lengths of Cantor segs intersected with [0,r]
    function build(a, b, lvl) {
      if (lvl===0) { const lo=Math.max(a,0), hi=Math.min(b,r); return hi>lo?hi-lo:0; }
      const t=(b-a)/3;
      return build(a,a+t,lvl-1) + build(b-t,b,lvl-1);
    }
    return build(0,1,n);
  }
  const W=520, H=190, PX=44, PY=24;
  const iW=W-2*PX, iH=H-2*PY;
  const NP=250;
  const plotPts = Array.from({length:NP+1},(_,i)=>{
    const r=Math.pow(10,-3+3*(i/NP)); // 10^-3 to 10^0
    const d = r>0 ? cantorFrac(Math.min(r,1),5)/r : 0;
    return [i/NP, Math.min(1.1,Math.max(0,d))];
  });
  const pathD = plotPts.map(([t,d],i)=>`${i===0?'M':'L'}${(PX+t*iW).toFixed(1)},${(PY+(1-d)*iH).toFixed(1)}`).join(' ');
  const curX = PX+(slider/1000)*iW;
  const r = Math.pow(10,-3+3*(slider/1000));
  const dens = r>0 ? cantorFrac(Math.min(r,1),5)/r : 0;
  return h('div',null,
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',maxWidth:W,display:'block',margin:'0 auto'}},
      h('line',{x1:PX,y1:PY,x2:PX,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      h('line',{x1:PX,y1:PY+iH,x2:PX+iW,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      [0,0.5,1].map(v=>h('line',{key:v,x1:PX,y1:PY+(1-v)*iH,x2:PX+iW,y2:PY+(1-v)*iH,stroke:'var(--border)',strokeWidth:1,strokeDasharray:'3,3'})),
      [0,0.5,1].map(v=>h('text',{key:'ly'+v,x:PX-5,y:PY+(1-v)*iH+4,textAnchor:'end',fontSize:10,fill:'var(--text-muted)'},v)),
      h('path',{d:pathD,fill:'none',stroke:AC,strokeWidth:2}),
      h('line',{x1:curX,y1:PY,x2:curX,y2:PY+iH,stroke:ACL,strokeWidth:1.5,strokeDasharray:'3,3'}),
      h('text',{x:PX,y:H-6,fontSize:10,fill:'var(--text-muted)'},'10⁻³'),
      h('text',{x:PX+iW,y:H-6,textAnchor:'end',fontSize:10,fill:'var(--text-muted)'},'1'),
      h('text',{x:W/2,y:H-6,textAnchor:'middle',fontSize:10,fill:'var(--text-muted)'},'← log r →'),
      h('text',{x:4,y:H/2,fontSize:10,fill:'var(--text-muted)',transform:`rotate(-90,4,${H/2})`},'m(C∩[0,r])/r')
    ),
    h('input',{type:'range',min:0,max:1000,value:slider,onInput:ev=>setSlider(+ev.target.value),style:{width:'100%',marginTop:8}}),
    h('div',{style:{textAlign:'center',fontSize:12,color:'var(--text-muted)',marginTop:4}},
      `r ≈ ${r.toExponential(2)},  density ≈ ${dens.toFixed(3)}`)
  );
}

// ── Exercise45 ────────────────────────────────────────────────────────────
function Exercise45() {
  const [fi, setFi] = useState(0);
  const [n, setN] = useState(4);
  const FUNCS = [
    {name:'6x²', f:x=>6*x*x, dom:[0,1]},
    {name:'3+3sin(6πx)', f:x=>3+3*Math.sin(6*Math.PI*x), dom:[0,1]},
    {name:'1/√x', f:x=>x<=0.002?Infinity:1/Math.sqrt(x), dom:[0.001,1]},
  ];
  const {f, dom} = FUNCS[fi];
  const CAP=16, D=Math.pow(2,n);
  function phi(x) { const v=f(x); if(!isFinite(v)||v>=CAP) return CAP; return Math.floor(v*D)/D; }
  const W=520,H=270,PX=36,PY=22;
  const iW=W-2*PX, iH=H-2*PY;
  const NP=400;
  const xs = Array.from({length:NP+1},(_,i)=>dom[0]+(i/NP)*(dom[1]-dom[0]));
  const fVals = xs.map(x=>Math.min(CAP,isFinite(f(x))?f(x):CAP));
  const pVals = xs.map(x=>phi(x));
  const yMax = Math.max(...fVals.filter(isFinite))||1;
  function toPath(vals,col) {
    const d = vals.map((y,i)=>`${i===0?'M':'L'}${(PX+(xs[i]-dom[0])/(dom[1]-dom[0])*iW).toFixed(1)},${(PY+(1-Math.min(y,yMax)/yMax)*iH).toFixed(1)}`).join(' ');
    return h('path',{d,fill:'none',stroke:col,strokeWidth:2});
  }
  return h('div',null,
    h('div',{style:{display:'flex',gap:7,marginBottom:12,flexWrap:'wrap'}},
      FUNCS.map((fn,i)=>h(Btn,{key:i,onClick:()=>setFi(i),active:fi===i},fn.name))
    ),
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',maxWidth:W,display:'block',margin:'0 auto'}},
      h('line',{x1:PX,y1:PY,x2:PX,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      h('line',{x1:PX,y1:PY+iH,x2:PX+iW,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      toPath(fVals, ACL+'70'),
      toPath(pVals, AC)
    ),
    h('div',{style:{display:'flex',gap:14,marginTop:8,fontSize:12,color:'var(--text-muted)',alignItems:'center',flexWrap:'wrap'}},
      h('span',null,h('span',{style:{color:ACL+'bb'}},'─ '),`f(x)  `,h('span',{style:{color:AC}},'─ '),`φₙ (n=${n})`),
      h('div',{style:{display:'flex',gap:7,marginLeft:'auto'}},
        h(Btn,{onClick:()=>setN(Math.max(1,n-1))},'−'),
        h(Btn,{onClick:()=>setN(Math.min(8,n+1))},'+')
      )
    )
  );
}

// ── LebesgueInfimum ────────────────────────────────────────────────────────
function LebesgueInfimum() {
  const [n, setN] = useState(3);
  const [mode, setMode] = useState('below');
  const CAP=18, D=Math.pow(2,n);
  function f(x) { return x<=0?CAP:Math.min(CAP,1/Math.sqrt(x)); }
  function phiB(x) { const v=1/Math.sqrt(x); if(!isFinite(v)||v>=CAP) return CAP; return Math.floor(v*D)/D; }
  function phiA(x) { const v=1/Math.sqrt(x); if(!isFinite(v)||v>=CAP) return CAP; return Math.min(CAP,Math.ceil(v*D)/D); }
  const phi = mode==='below'?phiB:phiA;
  const W=520,H=270,PX=36,PY=22;
  const iW=W-2*PX, iH=H-2*PY;
  const dom=[0.005,2], NP=400;
  const xs = Array.from({length:NP+1},(_,i)=>dom[0]+(i/NP)*(dom[1]-dom[0]));
  const fVals=xs.map(x=>f(x)), pVals=xs.map(x=>phi(x));
  function toPath(vals,col) {
    const d=vals.map((y,i)=>`${i===0?'M':'L'}${(PX+(xs[i]-dom[0])/(dom[1]-dom[0])*iW).toFixed(1)},${(PY+(1-y/CAP)*iH).toFixed(1)}`).join(' ');
    return h('path',{d,fill:'none',stroke:col,strokeWidth:2});
  }
  return h('div',null,
    h('div',{style:{display:'flex',gap:7,marginBottom:12}},
      h(Btn,{onClick:()=>setMode('below'),active:mode==='below'},'φₙ from below'),
      h(Btn,{onClick:()=>setMode('above'),active:mode==='above'},'φₙ from above')
    ),
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',maxWidth:W,display:'block',margin:'0 auto'}},
      h('line',{x1:PX,y1:PY,x2:PX,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      h('line',{x1:PX,y1:PY+iH,x2:PX+iW,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      toPath(fVals, ACL+'70'),
      toPath(pVals, AC),
      h('text',{x:PX+iW,y:PY+iH+14,textAnchor:'end',fontSize:10,fill:'var(--text-muted)'},'x=2'),
      h('text',{x:PX,y:PY+iH+14,fontSize:10,fill:'var(--text-muted)'},'x≈0')
    ),
    h('div',{style:{display:'flex',gap:14,marginTop:8,fontSize:12,color:'var(--text-muted)',alignItems:'center',flexWrap:'wrap'}},
      h('span',null,h('span',{style:{color:ACL+'bb'}},'─ '),`f(x)=1/√x  `,h('span',{style:{color:AC}},'─ '),`φ_${n} (${mode})`),
      h('div',{style:{display:'flex',gap:7,marginLeft:'auto'}},
        h(Btn,{onClick:()=>setN(Math.max(1,n-1))},'−'),
        h('span',{style:{minWidth:30,textAlign:'center'}},n),
        h(Btn,{onClick:()=>setN(Math.min(7,n+1))},'+')
      )
    )
  );
}

// ── FunctionSeriesChap4 ────────────────────────────────────────────────────
function FunctionSeriesChap4() {
  const [ni, setNi] = useState(1);
  const [ki, setKi] = useState(2);
  const NVALS=[0.5,1,2], KVALS=[1,2,4,8,16,32];
  const nv=NVALS[ni], kv=KVALS[ki];
  function fk(x) { if(x<0) return 0; const t=1-x/kv; return t<0?0:Math.pow(x,nv)*Math.pow(t,kv); }
  function fLim(x) { return x<0?0:Math.pow(x,nv)*Math.exp(-x); }
  const W=520,H=270,PX=36,PY=22;
  const iW=W-2*PX,iH=H-2*PY;
  const domEnd=Math.min(kv*1.6,30), NP=400;
  const xs=Array.from({length:NP+1},(_,i)=>i/NP*domEnd);
  const fkV=xs.map(x=>Math.max(0,fk(x))), flV=xs.map(x=>fLim(x));
  const yMax=Math.max(...fkV,...flV)||1;
  function toPath(vals,col,dash) {
    const d=vals.map((y,i)=>`${i===0?'M':'L'}${(PX+xs[i]/domEnd*iW).toFixed(1)},${(PY+(1-y/yMax)*iH).toFixed(1)}`).join(' ');
    return h('path',{d,fill:'none',stroke:col,strokeWidth:2,strokeDasharray:dash||''});
  }
  return h('div',null,
    h('div',{style:{display:'flex',gap:7,marginBottom:10,flexWrap:'wrap',alignItems:'center'}},
      h('span',{style:{fontSize:12,color:'var(--text-muted)'}},'n:'),
      NVALS.map((v,i)=>h(Btn,{key:i,onClick:()=>setNi(i),active:ni===i},`${v}`)),
      h('span',{style:{fontSize:12,color:'var(--text-muted)',marginLeft:8}},'k:'),
      KVALS.map((v,i)=>h(Btn,{key:i,onClick:()=>setKi(i),active:ki===i},`${v}`))
    ),
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',maxWidth:W,display:'block',margin:'0 auto'}},
      h('line',{x1:PX,y1:PY,x2:PX,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      h('line',{x1:PX,y1:PY+iH,x2:PX+iW,y2:PY+iH,stroke:'var(--text-muted)',strokeWidth:1}),
      toPath(fkV, AC),
      toPath(flV, ACL+'80','5,3'),
      h('text',{x:PX+iW-4,y:PY+14,textAnchor:'end',fontSize:10,fill:AC},`f_k, k=${kv}`),
      h('text',{x:PX+iW-4,y:PY+28,textAnchor:'end',fontSize:10,fill:ACL+'aa'},'x^n·e^{-x} (limit)')
    )
  );
}

// ── CoveringLemma ──────────────────────────────────────────────────────────
function CoveringLemma() {
  const INIT=[
    {id:0,x:190,y:155,r:68},{id:1,x:300,y:115,r:52},{id:2,x:160,y:255,r:38},
    {id:3,x:375,y:195,r:60},{id:4,x:270,y:230,r:36},{id:5,x:430,y:125,r:44},{id:6,x:115,y:170,r:30},
  ];
  const [balls,setBalls]=useState(INIT);
  const [sel,setSel]=useState([]);
  const [elim,setElim]=useState([]);
  const [rem,setRem]=useState(INIT.map(b=>b.id));
  const [show3,setShow3]=useState(true);
  const [msg,setMsg]=useState('Press "Next Step" to run the greedy algorithm.');
  function ints(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)<a.r+b.r;}
  function reset(){setSel([]);setElim([]);setRem(INIT.map(b=>b.id));setMsg('Reset. Press "Next Step".');}
  function rand(){
    const n=6+Math.floor(Math.random()*5);
    const nb=Array.from({length:n},(_,i)=>({id:i,x:70+Math.random()*400,y:50+Math.random()*230,r:18+Math.random()*58}));
    setBalls(nb);setSel([]);setElim([]);setRem(nb.map(b=>b.id));setMsg('Randomized. Press "Next Step".');
  }
  function step(){
    if(!rem.length){setMsg('Done! All balls processed.');return;}
    const rs=rem.map(id=>balls.find(b=>b.id===id));
    const big=rs.reduce((m,b)=>b.r>m.r?b:m,rs[0]);
    const toEl=rs.filter(b=>b.id!==big.id&&ints(b,big)).map(b=>b.id);
    const nSel=[...sel,big.id], nEl=[...elim,...toEl], nRem=rem.filter(id=>id!==big.id&&!toEl.includes(id));
    setSel(nSel);setElim(nEl);setRem(nRem);
    setMsg(`Selected ball ${big.id} (r=${big.r.toFixed(0)}). Eliminated ${toEl.length} ball(s). ${nRem.length} remaining.`);
  }
  const W=560, H=330;
  return h('div',null,
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',maxWidth:W,display:'block',margin:'0 auto',background:'var(--bg-elevated)',borderRadius:7}},
      balls.map(b=>{
        const isSel=sel.includes(b.id), isEl=elim.includes(b.id), isRem=rem.includes(b.id);
        const col=isSel?AC:isEl?'#4a6fa5':isRem?'#808080':'#444';
        return h('g',{key:b.id},
          isSel&&show3?h('circle',{cx:b.x,cy:b.y,r:3*b.r,fill:AC+'08',stroke:AC+'28',strokeWidth:1,strokeDasharray:'3,3'}):null,
          h('circle',{cx:b.x,cy:b.y,r:b.r,fill:col+'22',stroke:col,strokeWidth:isEl?1:2,opacity:isEl?.45:1}),
          h('text',{x:b.x,y:b.y+4,textAnchor:'middle',fontSize:11,fill:col},b.id)
        );
      })
    ),
    h('div',{style:{marginTop:7,fontSize:12,color:'var(--text-muted)',minHeight:34}},msg),
    h('div',{style:{display:'flex',gap:7,marginTop:7,flexWrap:'wrap'}},
      h(Btn,{onClick:step},'Next Step →'),
      h(Btn,{onClick:reset},'↺ Reset'),
      h(Btn,{onClick:rand},'🎲 Randomize'),
      h(Btn,{onClick:()=>setShow3(!show3),active:show3},'Show 3× balls')
    ),
    h('div',{style:{marginTop:7,fontSize:11.5,color:'var(--text-muted)',display:'flex',gap:14}},
      h('span',null,h('span',{style:{color:AC}},'●'),' Selected'),
      h('span',null,h('span',{style:{color:'#4a6fa5'}},'●'),' Eliminated'),
      h('span',null,h('span',{style:{color:'#808080'}},'●'),' Remaining')
    )
  );
}

// ── BmDerivative ───────────────────────────────────────────────────────────
function BmDerivative() {
  const [eps, setEps] = useState(0.05);
  const [bm, setBm] = useState([]);
  const [db, setDb] = useState([]);
  function normal() {
    let u,v,s;
    do{u=Math.random()*2-1;v=Math.random()*2-1;s=u*u+v*v;}while(s>=1||s===0);
    return u*Math.sqrt(-2*Math.log(s)/s);
  }
  function deriv(bm,e) {
    const N=bm.length, en=Math.max(1,Math.round(e*N));
    return bm.map((_,i)=>{const j=Math.min(N-1,i+en),k=Math.max(0,i-en);return(bm[j]-bm[k])/(2*e);});
  }
  function newPath() {
    const N=1000, dt=1/N; const path=[0];
    for(let i=1;i<N;i++) path.push(path[i-1]+normal()*Math.sqrt(dt));
    setBm(path); setDb(deriv(path,eps));
  }
  function chEps(d){const ne=parseFloat(Math.max(0.01,Math.min(0.2,eps+d)).toFixed(2));setEps(ne);if(bm.length)setDb(deriv(bm,ne));}
  useEffect(()=>{newPath();},[]);
  const W=520,H=100,PX=20,PY=16;
  const iW=W-2*PX,iH=H-2*PY;
  function Chart({pts,col,lbl}) {
    if(!pts.length) return h('div',{style:{height:H+20}});
    const mn=Math.min(...pts),mx=Math.max(...pts),sp=(mx-mn)||1;
    const d=pts.map((v,i)=>`${i===0?'M':'L'}${(PX+i/(pts.length-1)*iW).toFixed(1)},${(PY+(1-(v-mn)/sp)*iH).toFixed(1)}`).join(' ');
    return h('div',{style:{marginBottom:6}},
      h('div',{style:{fontSize:11,color:'var(--text-muted)',marginBottom:2}},lbl),
      h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',display:'block'}},
        h('line',{x1:PX,y1:PY+iH/2,x2:PX+iW,y2:PY+iH/2,stroke:'var(--border)',strokeWidth:1}),
        h('path',{d,fill:'none',stroke:col,strokeWidth:1.5})
      )
    );
  }
  return h('div',null,
    h(Chart,{pts:bm,col:ACL,lbl:'B(t) — Brownian motion sample path'}),
    h(Chart,{pts:db,col:'#c06060',lbl:`Δ_ε B(t) = [B(t+ε)−B(t−ε)]/(2ε),  ε = ${eps}`}),
    h('div',{style:{display:'flex',gap:9,marginTop:9,alignItems:'center',flexWrap:'wrap'}},
      h(Btn,{onClick:()=>chEps(-0.01)},'ε −'),
      h('span',{style:{fontSize:12,color:'var(--text-muted)',minWidth:50}},`ε = ${eps}`),
      h(Btn,{onClick:()=>chEps(+0.01)},'ε +'),
      h(Btn,{onClick:newPath,style:{marginLeft:8}},'↺ New path')
    ),
    h('div',{style:{marginTop:8,fontSize:11.5,color:'var(--text-muted)'}},
      `As ε→0 the differences blow up — B(t) is nowhere differentiable a.s.`
    )
  );
}

<div class="card card-def"><div class="card-label">Definition 3.1 — An algebra or field</div><p>An algebra or field of subsets of \\(X\\) is a family of subsets of \\(X\\) which is closed under finite set theoretic operations, i.e.</p>
<ol><li>\\(X, \\phi \\in \\mathcal A\\)</li><li>\\(A_1, A_2,...,A_N\\) in \\(\\mathcal A\\) implies \\(\\bigcup A_i \\in \\mathcal A\\) (note that the union is FINITE)</li><li>\\(A \\in \\mathcal A \\Rightarrow A^c \\in \\mathcal A\\)</li></ol></div>
<p>A \\(\\sigma\\)-field, see Lecture 2 - Probability theory, has a similiar definition, but 2 is replaced by the stronger condition that it is closed under <em>countable</em> unions. It is thus closed under countable set theoretic operations.</p>
<p>We can construct a \\(\\sigma\\)-algebra on any set \\(X\\) as:</p>
<ol><li>\\(\\mathcal F_1 = \\{X, \\emptyset\\}\\)</li><li>\\(\\mathcal F_2 = \\{A: \\mathrm{A \\ is \\ countable \\ or } A^c \\ \\text{is \\ countable}\\}\\)</li><li>\\(\\mathcal F_3 = \\mathcal P(X)\\) (the powerset of \\(X\\))</li></ol>
<div class="card card-thm"><div class="card-label">Proposition 3.4. \\(\\sigma\\)-algebra generated by a set.</div><p>Given a collection \\(\\mathcal{E}\\) of subsets of \\(X\\) (i.e., a subset of \\(\\mathcal{P}(X)\\)), there is a smallest \\(\\sigma\\)-algebra containing \\(\\mathcal{E}\\), denoted by \\(\\sigma(\\mathcal{E})\\), called the \\(\\sigma\\)-algebra generated by \\(\\mathcal{E}\\). <em>Proof</em>: t is easy to prove that \\(\\sigma(\\mathcal E)\\) is a \\(\\sigma\\)-algebra. By construction, \\(\\mathcal E\\) is contained within the generated \\(\\sigma\\)-algebra as its contained in every \\(\\mathcal F\\) by construction. Every \\(\\mathcal F\\) therefore contains \\(\\emptyset\\) (as it is a \\(\\sigma\\)-algebra), so they are also in the intersection. It is also straightforward to be closed under complements. The hard part is proving that its closed under countable unions. \\(A_i \\in \\mathcal F\\) for every \\(\\mathcal F\\) but each \\(\\mathcal F\\) is also a \\(\\sigma\\)-algebra. Thus \\(\\bigcup_i A_i \\in \\mathcal F\\), but if its contained in every \\(\\mathcal F\\), it must also be contained in the union of all those \\(\\mathcal F\\)'s, thus \\(\\bigcup_i A_i \\in \\sigma(\\mathcal E)\\). \\(\\square\\). It must also be the smallest \\(\\sigma\\)-algebra. If \\(\\mathcal G\\) is any other \\(\\sigma\\)-algebra containing \\(\\mathcal E\\) is must be one of the \\(\\mathcal F\\)'s and therefore \\(\\sigma(\\mathcal E)\\subseteq \\mathcal G\\). As a simple example, consider the sets \\(A,B,C\\) and their intersection, then the intersection is always contained in each individual piece.</p></div>
<p><strong>Convince yourself that it is the smallest indeed</strong></p>
<p>An example of this is the following: Take \\(X = \\{1,2,3\\}\\) and \\(\\mathcal E = \\{\\{1\\}\\}\\). We need to find all \\(\\sigma\\)-algebras on \\(X\\) containing \\(\\mathcal E\\). Remember that the number of possible \\(\\sigma\\)-algebras on a set \\(X\\) is given by the Bell number (in this case 5). From our previous exercise, we know only two contain \\(\\{1\\}\\), i.e. \\(\\mathcal F_1 = \\{\\emptyset, \\{1\\}, \\{2,3\\}, X\\}\\) and \\(\\mathcal F_2 = \\mathcal P(X)\\). Intersecting them all, we have \\(\\sigma(\\mathcal E) = \\mathcal F_1 \\cup \\mathcal F_2 = \\mathcal F_1\\).</p>
<p><strong>Question</strong>: This kind of construction of generating a smallest \\(\\sigma\\)-algebra is done from the outside. You can also construct it from the inside, but that is more complicated. The idea is to first close the set under complementation, and then take countable intersections, then close under complementation with those new sets, and repeat. This differs from constructing a topology from a collection of subsets, where it suffices to first close under finite intersections followed by arbitrary unions. The reason for this is that we demand closure under complements, so that the union of two sets A and B, followed by the complement, produces \\(A^c \\cap B^c\\) which is a new type of set (an intersection) we did not have before, so we need to close under unions again.</p>
<div class="card card-def"><div class="card-label">Open set</div><p>An open set in \\(\\mathbb{R}\\): \\(O\\) is open if for all \\(x \\in O\\), there exists \\(\\epsilon > 0\\) so that \\((x - \\epsilon, x + \\epsilon) \\subseteq O\\). [!CARD] Definition 3.5 — Borel algebra</p>
<p>[!definition] The \\(\\sigma\\)-algebra generated by the open subsets of \\(\\mathbb{R}\\) is called the <strong>Borel \\(\\sigma\\)-algebra</strong> of \\(\\mathbb{R}\\) and is denoted by \\(\\mathcal{B}\\). The sets in \\(\\mathcal{B}\\) are called <strong>Borel sets</strong>. [!exercise] Exercise 3.5 Show that \\(\\mathcal{B}\\) is also <strong>(1)</strong> the \\(\\sigma\\)-algebra generated by the open intervals and <strong>(2)</strong> the \\(\\sigma\\)-algebra generated by the closed intervals.</p>
<p>To prove (1), let \\(\\mathcal E\\) be the family of all open subsets of the real line, whereas \\(\\mathcal E'\\) is the family of all open intervals of the real line. It is clear that \\(\\mathcal E' \\subseteq \\mathcal E\\) since an open interval is a special case of an open subset. By monoticity, it thus follows \\(\\sigma(\\mathcal E') \\subseteq \\sigma(\\mathcal E) = \\mathcal B\\). What remains is to prove that \\(\\sigma(\\mathcal E) \\subseteq \\sigma(\\mathcal E')\\) to prove that the algebras are identical. This holds IF \\(\\mathcal E \\subseteq \\sigma(\\mathcal E')\\), since by monoticity you would have \\(\\sigma(\\mathcal E) \\subseteq \\sigma(\\sigma(\\mathcal E')) = \\sigma(\\mathcal E')\\). Since \\(\\mathcal E\\) is the family of all open subsets of the real line, this amounts to proving that every open set lies in \\(\\sigma(\\mathcal E')\\), i.e. every open set is a countable union of open intervals. To prove this statement, we need to show that for an arbitrary open set \\(\\mathcal O \\subseteq \\mathbb R\\) we can write it as a countable union. In particular, let \\(x\\in \\mathcal o\\), then since the subset is open, we have \\((x-\\epsilon, x+\\epsilon)\\subseteq \\mathcal O\\) for some \\(\\epsilon\\). We can always find some rationals \\(a,b \\in \\mathbb Q\\) such that \\(x\\in (a,b)\\subseteq(x-\\epsilon, x+ \\epsilon) \\subseteq \\mathcal O\\). So every \\(x\\) is contained in some open interval with rational endpoints, this means that \\(\\mathcal O = \\bigcup \\{(a,b): a,b\\in \\mathbb Q, (a,b)\\subseteq O\\}\\) which is a countable union as \\(\\mathbb Q \\times \\mathbb Q\\) is countable (countably many pairs of rationals, and thus countably many intervals).</p>
<p>To prove (2), let \\(\\mathcal E''\\) be the family of all closed intervals of the real line. We proceed similarly as before, since the complement of a closed interval is open, it is an element of \\(\\mathcal B\\). Thus the collection of all closed intervals are contained within \\(\\mathcal B\\), i.e. \\(\\mathcal E'' \\subseteq \\mathcal B\\), which by monoticity gives \\(\\sigma(\\mathcal E'') \\subseteq \\mathcal B\\). To prove the reverse direction, IF we have \\(\\mathcal E \\subseteq \\sigma(\\mathcal E'')\\) it follows by monoticity that \\(\\sigma(\\mathcal E) = \\mathcal B \\subseteq \\sigma(\\mathcal E'')\\) and thus we have proven they are identical (contained in each other). The IF statement amounts to showing that any open subset can be written as the countable union of sets of closed intervals. Since we already know that any open subset can be written as countable union of sets of open intervals, it suffices to construct an open interval from a union of closed intervals i.e. \\[(a_n, b_n) = \\bigcup_{k=1}^\\infty [a_n + 1/k, b_n - 1/k]\\]</p></div>
<p>Most sets (and very likely all sets) that you have seen are Borel sets. There are other notions of sets "being closed under certain operations" which turn out to be useful. Here are two such.</p>
<div class="card card-def"><div class="card-label">Definition 3.6 — A \\(\\pi\\)-system</div><p>Let \\(X\\) be a nonempty set. A nonempty collection \\(\\mathcal{I}\\) of subsets of \\(X\\) is called a <strong>\\(\\pi\\)-system</strong> if it is closed under finite intersections; i.e., \\(A, B \\in \\mathcal{I}\\) implies \\(A \\cap B \\in \\mathcal{I}\\).</p></div>
<p>Note that both fields and \\(\\sigma\\)-fields are examples of \\(\\pi\\)-systems. A \\(\\pi\\)-system is a weaker condition.</p>
<div class="card card-def"><div class="card-label">Definition 3.7 — A \\(\\mathcal D\\) (\\(\\lambda\\))-system</div><p>Let \\(X\\) be a nonempty set. A nonempty collection \\(\\mathcal{D}\\) of subsets of \\(X\\) is called a \\(\\mathcal{D}\\)-system if</p>
<p><strong>(a)</strong> \\(X \\in \\mathcal{D}\\)</p>
<p><strong>(b)</strong> \\(E, F \\in \\mathcal{D}\\) and \\(E \\subseteq F\\) imply \\(F \\setminus E\\, (= F \\cap E^c) \\in \\mathcal{D}\\)</p>
<p><strong>(c)</strong> \\(E_1 \\subseteq E_2 \\subseteq E_3 \\subseteq \\cdots\\) and \\(E_i \\in \\mathcal{D}\\) for all \\(i\\) imply \\(\\bigcup_i E_i \\in \\mathcal{D}\\).</p>
<p>(Note that a \\(\\mathcal{D}\\)-system is closed under complementation. The way to see this is that \\(X \\in \\mathcal D\\), so taking \\(F = X\\) and \\(E  \\subseteq X\\) (which is also contained in \\(\\mathcal D\\)) we have \\(X \\setminus E = E^c\\) by definition.</p></div>
<p>Note that definition 3.7 above is a weaker structure than a \\(\\sigma\\)-algebra (which is closed under ALL countable unions) whereas \\(\\mathcal D\\)-systems are only closed under increasing countable unions.</p>
<div class="card card-thm"><div class="card-label">Theorem 3.8 \\(\\sigma\\)-algebra iff \\(\\pi\\) and \\(\\lambda\\)-system.</div><p>If \\(\\mathcal{M}\\) is a collection of subsets of a set \\(X\\), then \\(\\mathcal{M}\\) is a \\(\\sigma\\)-algebra if and only if \\(\\mathcal{M}\\) is a \\(\\pi\\)-system and a \\(\\mathcal{D}\\)-system [!exercise] Exercise 3.6: Prove Theorem 3.8.</p>
<p>To prove it, first assume \\(\\mathcal M\\) is a \\(\\sigma\\)-algebra, then we know from exercise 3.1 that it is closed under finite intersections, and is thus also a \\(\\pi\\)-system. Similarly,we know the algebra also contains \\(X\\). Furthermore, if \\(E, F \\in \\mathcal M\\) and \\(\\mathcal E \\subseteq \\mathcal F\\) then \\(F \\setminus E = F\\cap E^c \\in \\mathcal M\\) as \\(E^c\\) also in the algebra by complementation, and it is closed under finite intersections as shown in exercise 3.1. Finally, as the \\(\\sigma\\)-algebra is closed under countable intersections, it follows that (c) is also satisifed. Hence it is also a \\(\\mathcal D\\)-system.</p>
<p>We are left with proving the reverse statement, namely that if \\(\\mathcal M\\) is a \\(\\pi \\ \\& \\ \\mathcal D\\)-system, then it is also a \\(\\sigma\\)-algebra. Note that the D-system provides us with \\(X\\), and since its closed under complementation also it provides us with the empty set and thus we are left to show that we have closure under countable unions. We have so far not used the \\(\\pi\\)-system at all, so it has to enter here. Take \\(A, B \\in \\mathcal M\\) whose complements are contained in \\(M\\) by the D-system property. By the \\(\\pi\\)-system property,  it is closed under finite intersections, thus the union \\(A \\cup B = (A^c \\cap B^c)^c \\in \\mathcal M\\) by De Morgan. As shown in exercise 3.1, this extends to any finite union using proof by induction. We are left to show that it extends to an arbitrary countable union of \\(A_1,A_2,... \\in \\mathcal M\\). We would ideally want to use the \\(D\\)-system property (c) for this, but to do so, we first need to convert the countable set into an increasing set so that we can apply (c). We can do so by defining the countable series \\(B_n = \\bigcup_{i=1}^n A_n\\) where \\(B_1 \\subseteq B_2\\) etc... Since each \\(B_n\\) is contained in \\(\\mathcal M\\) by finite unions just shown, it follows by property (c) of the D-system that \\(\\bigcup_i A_i = \\bigcup_i B_i \\in \\mathcal M\\)</p></div>
<p>Given a collection \\(\\mathcal{E}\\) of subsets of \\(X\\), we have previously defined \\(\\sigma(\\mathcal{E})\\) as the smallest \\(\\sigma\\)-algebra containing \\(\\mathcal{E}\\). We do something similar here.</p>
<div class="card card-def"><div class="card-label">Definition 3.9. Generated \\(\\pi\\) and \\(\\lambda\\) system</div><p>We let \\(\\pi(\\mathcal{E})\\) (\\(\\mathcal{D}(\\mathcal{E})\\)) be the smallest \\(\\pi\\)-system (\\(\\mathcal{D}\\)-system) containing \\(\\mathcal{E}\\). [!exercise] Exercise 3.7 Show that these exist and how to construct them. Define \\(\\pi(\\mathcal E) = \\bigcap_{\\mathfrak p  : \\mathfrak p \\supseteq \\mathcal E} \\mathfrak p\\) where \\(\\mathfrak p\\) is a \\(\\pi\\)-system containing \\(\\mathcal E\\). To show that it is a \\(\\pi\\)-system, we just have to check that it is closed under finite intersections. For this, take \\(E_1, E_2 \\in \\pi(\\mathcal E)\\), clearly \\(E_1, E_2 \\in \\mathfrak p\\) \\(\\forall \\mathfrak p\\) and since \\(\\mathfrak p\\) is a \\(\\pi\\)-system, it is closed under finite intersections and thus \\(E_1 \\cap E_2 \\in \\mathfrak p\\) for every \\(\\mathfrak p\\) and thus \\(E_1 \\cap E_2 \\in \\bigcap_{\\mathfrak p  : \\mathfrak p \\supseteq \\mathcal E} \\mathfrak p\\).</p></div>
<p>The next theorem is a very important tool, called <strong>Dynkin's \\(\\pi\\)-\\(\\lambda\\) Theorem</strong> (a \\(\\mathcal{D}\\)-system is sometimes called a \\(\\lambda\\)-system).</p>
<div class="card card-thm"><div class="card-label">Theorem 3.10 — Dynkin's \\(\\pi\\)-\\(\\lambda\\) Theorem</div><p>If \\(\\mathcal{I}\\) is a \\(\\pi\\)-system, then \\[\\mathcal{D}(\\mathcal{I}) = \\sigma(\\mathcal{I})\\] In other words, the smallest Dynkin-system generated by the \\(\\pi\\)-system is the same as the \\(\\sigma\\)-algebra generated by the \\(\\pi\\)-system.</p></div>
<hr class="lecture-sep">
<div class="card card-def"><div class="card-label">Definition 3.12 (A measure)</div><ol><li>\\(m(\\emptyset) = 0\\)</li><li>If \\(A_1, A_2, \\ldots\\) are (pairwise) disjoint elements of \\(\\mathcal{M}\\), then</li></ol>
<p>\\[m\\left(\\bigcup_i A_i\\right) = \\sum_i m(A_i)\\]</p></div>
<p><strong>Remarks:</strong></p>
<ol><li>The crucial second property is called <strong>countable additivity</strong> and implies finite additivity using 1. (Check this.)</li><li>For \\(A \\in \\mathcal{M}\\), \\(m(A)\\) is thought of as either the <strong>(a)</strong> measure, <strong>(b)</strong> size, <strong>(c)</strong> length or <strong>(d)</strong> probability of \\(A\\).</li></ol>
<p>A measure space is just a measurable space with a measure on it.</p>
<div class="card card-ex"><div class="card-label">Exercise 3.8</div><p>Let \\(X = \\{1, 2, 3, \\ldots\\}\\) and consider a vector \\(p_1, p_2, \\ldots\\) of nonnegative numbers with \\(\\sum_{i=1}^\\infty p_i = 1\\). Let \\(\\mathcal{M}\\) be all subsets of \\(X\\) and for \\(S \\subseteq X\\), let \\[m(S) := \\sum_{i \\in S} p_i\\] Verify that \\((X, \\mathcal{M}, m)\\) is a measure space. Does it have any probabilistic interpretation?</p>
<hr>
<p>Since \\(\\mathcal M = \\mathcal P(\\mathbb N)\\) it is clearly a \\(\\sigma\\)-algebra. The tuple \\((\\mathbb N, \\mathcal M)\\) therefore constitutes a measurable space. It suffices to show that the measure \\(m\\) satisfies the two defining properties. Namely if we take \\(S = \\emptyset\\) then clearly \\(\\sum_{i \\in S} p_i = 0\\). Similarly take \\(S_1, S_2,...\\) being pairwise disjoint, then we have \\[m(\\bigcup_i S_i) = \\sum_{i \\in \\bigcup_k S_k} p_i = \\sum_{i \\in S_1} p_i + \\sum_{i\\in S_2} +... = \\sum_i m(S_i)\\]  Its probabilistic interpretation: it is a discrete probability distribution on \\(\\mathbb N\\). e.g. we may take \\(X = \\{1,2,3,4,5,6\\}\\) and assign \\(p_i = 1/6\\) for all \\(i\\). Then \\(m(\\{1\\}) = 1/6\\) whereas \\(m(\\{2,4,6\\}) = 1/2\\).</p></div>
<div class="card card-def"><div class="card-label">A complete measure.</div></div>
<p>This definition may sound silly at first, because by monotonicity we know that \\(m(E) = 0\\) if it is a subset. But we have to remember that the measure can only be applied to elements of the \\(\\sigma\\)-algebra. A complete measure thus tells us that subsets of sets of measure zero, <strong>are in the \\(\\sigma\\)-algebra</strong> (thus they are measurable).</p>
<p>Note that we never assumed \\(A\\) was an element of the \\(\\sigma\\)-algebra.  See https://www.youtube.com/watch?v=5bZMCLnI_p4 for a good explanation. A complete measure is a measure space where every subset of every null set is measurable. A null set is an element of the sigma-algebra whose measure is zero.</p>
<div class="card card-def"><div class="card-label">Definition 3.16 — Almost Everywhere / Almost Surely</div></div>
<p>For example, taking \\(X\\) to be the closed interval from 0 to 1 and \\(\\mathcal M\\) the Borel \\(\\sigma\\)-algebra on that set with Lebesgue measure. It turns out that the property that \\(x\\) is irrational (i.e. the property that it fails corresponds to \\(x\\) being a rational which has measure zero) holds almost everywhere.</p>
<div class="card card-def"><div class="card-label">Definition. Finite measure space</div><p>[!CARD]  \\(\\sigma\\)-finite measure space [!definition] A measure space is called \\(\\sigma\\)-finite if there exists subsets \\(A_1,A_2,...\\) so that \\(X = \\bigcup_i A_i\\) with \\(\\mu(A_i) < \\infty \\forall i\\).</p></div>
<p>\\(\\sigma\\)-finite is a weaker condition, it only demands that the subsets which make up \\(X\\) have finite measure. Finite is a stronger condition, which demands that the full set \\(X\\) has finite measure.</p>
<div class="card card-ex"><div class="card-label">Exercise 3.10</div><p><strong>1.</strong> Show Lebesgue measure on \\(\\mathbb{R}\\) is \\(\\sigma\\)-finite.</p>
<p>Take \\(X = \\mathbb R\\). We know that \\(A_n = (-n, n)\\) is a Borel set (all open intervals are Borel sets). The measure is always finite for a fixed \\(n\\), given by \\(2n\\). Similarly, we know that \\(\\bigcup_i A_i = \\mathbb R\\). Just take any \\(x\\in \\mathbb R\\), then there exists an \\(N\\) such that \\(N> |x|\\) such that \\(x \\in A_N\\), thus \\(\\mathbb R\\) with Lebesgue measure is \\(\\sigma\\)-finite.  <strong>2.</strong> Can one take the \\(A_i\\)'s in the definition of \\(\\sigma\\)-finiteness to be disjoint?</p>
<p>Yes, we can for example construct \\(B_n = A_n \\setminus \\bigcup_{i=1}^{n-1} A_i\\), which again is coverable. Since \\(B_n \\subseteq A_n\\) and \\(A_n\\) was finite, so is \\(B_n\\), they are also disjoint by construction and in \\(\\mathcal M\\) (closed under set differences, note that it can be written as a finite intersection). Or you could also just cover it using for example \\(B_n = [n-1,n)\\) for \\(n \\in \\mathbb Z\\). These are disjoint sets with unit Lebesgue measure.</p>
<p><strong>3.</strong> Construct an example of a measure space which is not \\(\\sigma\\)-finite.</p>
<p>Take \\(X = \\mathbb R\\) with \\(\\mathcal M = \\mathcal P(\\mathbb R)\\) and \\(\\mu(A) = |A|\\) which is the so-called counting measure (computes the number of elements in A). We show this using proof by contradiction. Suppose that \\(\\mathbb R = \\bigcup_n A_n\\) with \\(\\mu(A_n) <\\infty\\). Since \\(\\mu(A_n) <\\infty\\), each such set must be finite (by the definition of the counting measure). But a countable union of a finite (countable set) is also countable, but we know the reals are uncountable, so this clearly can not be true.</p></div>
<div class="card card-def"><div class="card-label">Definition 3.19 — Atoms, Atomic and Continuous Measure Spaces</div><p>Assume \\((X, \\mathcal{M}, \\mu)\\) is a measure space with all single points being measurable. An <strong>atom</strong> is a point \\(x\\) with \\(\\mu(\\{x\\}) > 0\\).</p>
<p>Letting \\(A\\) be the set of atoms:</p>
<ul><li>\\((X, \\mathcal{M}, \\mu)\\) is called <strong>atomic</strong> if \\(A \\in \\mathcal{M}\\) and \\(\\mu(A^c) = 0\\)</li><li>\\((X, \\mathcal{M}, \\mu)\\) is called <strong>continuous</strong> if there is no atom, i.e. \\(\\mu(\\{x\\}) = 0\\) for all \\(x \\in X\\)</li></ul></div>
<p>The Lebesgue measure on the Borel algebra is a continuous measure, so there are no atoms.</p>
<p>For the counting measure on \\(\\mathbb R\\), it is clear that \\(A = \\mathbb R\\) where \\(\\mathbb R^c=\\emptyset\\). The measure space with the counting measure is thus atomic.</p>
<div class="card card-ex"><div class="card-label">Exercise 3.11</div><p>If a measure space is \\(\\sigma\\)-finite and with all single points being measurable, then A (the set of atoms) must be countable and hence automatically measurable.</p>
<hr>
<p>To prove this, note that by \\(\\sigma\\)-finiteness we have that each \\(A_i\\) has finite measure. Since each atom has strictly positive measure, each \\(A_i\\) can only consist of a countable number of atoms. To show this, define for each \\(k \\in \\mathbb{N}\\):</p></div>
<p>\\[A_i^k = \\left\\{x \\in A_i : \\mu(\\{x\\}) > \\frac{1}{k}\\right\\}\\] We claim \\(A_i^k\\) must be finite. Assume for contradiction it is not — then it contains infinitely many points \\(x_1, x_2, \\dots\\) each with \\(\\mu(\\{x_j\\}) > 1/k\\). By \\(\\sigma\\)-additivity (since singletons are disjoint): \\[\\mu(A_i) \\geq \\mu(A_i^k) \\geq \\mu\\left(\\bigcup_{j=1}^\\infty \\{x_j\\}\\right) = \\sum_{j=1}^\\infty \\mu(\\{x_j\\}) > \\sum_{j=1}^\\infty \\frac{1}{k} = \\infty\\] where we used monotonicity of the measure in the first and second step. The result contradicts \\(\\mu(A_i) < \\infty\\). Hence \\(A_i^k\\) is finite for each \\(k\\). Since every atom \\(x \\in A_i\\) satisfies \\(\\mu(\\{x\\}) > 0\\), it belongs to \\(A_i^k\\) for sufficiently large \\(k\\), and therefore: \\[\\{x \\in A_i : \\mu(\\{x\\}) > 0\\} = \\bigcup_{k=1}^\\infty A_i^k\\] which is a countable union of finite sets, hence countable.</p>
<div class="card card-thm"><div class="card-label">Theorem 3.20 — Lebesgue Measure</div><p>There exists a translation invariant measure \\(m\\) on \\((\\mathbb{R}, \\mathcal{B})\\) such that: \\[m([a,b]) = b - a \\quad \\text{for all } a < b\\]</p>
<p>\\(m\\) is the <strong>Lebesgue measure</strong> restricted to \\(\\mathcal{B}\\).</p></div>
<p>Our length metric is not defined for all subsets, but only those reasonable ones (the Borel sets).</p>
<div class="card card-remark"><div class="card-label">Outline the five-step procedure for constructing the Lebesgue measure:</div><ol><li>Define an outer measure</li><li>Use the length notation for intervals to construct a Lebesgue outer measure (defined for ALL subsets) - unfortunately will not be countably additive.</li><li>Show that Lebesgue outer measure of an interval is its length.</li><li>Use Caratheodory's extension theorem (given an outer measure on an arbitrary set X there is a sigma algebra s.t. the outer measure restricted to that sigma algebra is a complete measure. )</li><li>Show that for the Lebesgue outer measure on R, the sigma algebra constructed in 4) contains the Borel algebra.</li></ol></div>
<h4>Step 1</h4>
<div class="card card-def"><div class="card-label">Definition — Outer Measure</div><p>An <strong>outer measure</strong> on a set \\(X\\) is a function \\(\\mu^\\star: \\mathcal{P}(X) \\to [0, \\infty]\\) satisfying:</p>
<ol><li>\\(\\mu^\\star(\\emptyset) = 0\\)</li></ol>
<ol><li>\\(A \\subseteq B \\implies \\mu^\\star(A) \\leq \\mu^\\star(B)\\) <strong>(monotonicity)</strong></li></ol>
<ol><li>\\(\\mu^\\star\\!\\left(\\bigcup_{n=1}^\\infty A_n\\right) \\leq \\sum_{n=1}^\\infty \\mu^\\star(A_n)\\) <strong>(countable subadditivity)</strong></li></ol></div>
<p>This is to be compared with the definition 3.12 earlier, where the measure only has to satisfy that the measure on the empty set is zero, and being countably additive. Here, we see that we only demand countable subadditivity and monotonicity.</p>
<h4>Step 2</h4>
<div class="card card-def"><div class="card-label">Definition — Lebesgue Outer Measure</div><p>Let \\(X = \\mathbb{R}\\) and \\(A \\subseteq \\mathbb{R}\\). The <strong>Lebesgue outer measure</strong> is:</p>
<p>\\[\\mu^\\star(A) := \\inf\\left\\{ \\sum_{i=1}^\\infty |I_i| : I_1, I_2, \\ldots \\text{ are open intervals with } A \\subseteq \\bigcup_i I_i \\right\\}\\]</p>
<p>where \\(|I|\\) denotes the length of an interval \\(I\\).</p></div>
<p>In other words if we have a set \\(A\\), we consier all possible unions of open intervals for which \\(A\\) is a subset of that union, and sum up the length contributions, and finally take the infimum (the largest lower bound), i.e. cover A by intervals as efficiently as possible.</p>

<p>(ii) Since every valid cover of B is also a valid cover of A, the set of valid covers of B must be a subset of the valid covers of A (\\(\\mathcal C_B \\subseteq \\mathcal C_A\\)). The infimum of a larger set is smaller than the infimum of the smaller set, and this the result follows, i.e.   (iii) Case 1: In the case where \\(\\mu^\\star(A_n)=\\infty\\) for some \\(n\\), the inequality holds trivially. Case 2: \\(\\mu^\\star(A_n)<\\infty \\forall n\\).</p>
<p>As additional comments: the first inequality is guaranteed by the definition of the infimum. It tells us that we can cover \\(A_j\\) arbitrarily close. In the second line, we first  use that \\(\\bigcup A_j \\subseteq \\bigcup_{ij} I^j_i\\) and \\(\\mu^\\star\\) is the infimum over all covers, we get the first inequality. Ther est follows trivially.</p></div>

<h4>Step 4</h4>
<p>Now we defined the outer measure, introduced the Lebesgue outer measure (and proved that it indeed is an outer measure) and that the measure evaluated on finite intervals gives the length of the interval. Now enters step 4, where we apply Caratheodory's theorem.</p>
<div class="card card-def"><div class="card-label">Definition 3.24 — \\(\\mu^\\star\\)-Measurable Sets</div><p>If \\(\\mu^\\star\\) is an outer measure on \\(X\\), we call a subset \\(A \\subseteq X\\) <strong>\\(\\mu^\\star\\)-measurable</strong> if for all \\(E \\subseteq X\\):</p>
<p>\\[\\mu^\\star(E) = \\mu^\\star(E \\cap A) + \\mu^\\star(E \\cap A^c)\\]</p></div>
<p>The intuition for this is that the total outer measure of \\(E\\) equals a piece inside \\(A\\) and a piece outside of \\(A\\).</p>
<div class="card card-thm"><div class="card-label">Theorem 3.25 — Carathéodory's Theorem</div><p>If \\(\\mu^\\star\\) is an outer measure on \\(X\\), then the collection \\(\\mathcal{M}\\) of \\(\\mu^\\star\\)-measurable sets is a \\(\\sigma\\)-algebra and \\(\\mu^\\star\\) restricted to \\(\\mathcal{M}\\) is a measure, which is also complete.</p></div>
<h4>Step 5</h4>
<p>We will return to the proof in a moment. For step 5, we want to show that the Lebesgue outer measure on R, the \\(\\mathcal M\\) constructed in step 4 using Carathéodory's theorem contains \\(\\mathcal B\\).</p>
<p>Given \\(\\mathcal M\\) is a \\(\\sigma\\)-algebra and \\(\\mathcal B\\) is the smallest \\(\\sigma\\)-algebra containing all open intervals, it suffices to show that if the open intervals are a subset of \\(\\mathcal M\\) then \\(\\mathcal B \\subseteq \\mathcal M\\). Now \\(\\mathcal M\\) is the collection of all \\(\\mu^\\star\\) measurable sets, so we only need to verify that the open intervals \\((a,b\\)) are \\(\\mu^\\star\\)-measurable. It suffices to show this for the rays \\((-\\infty, a)\\) and \\((b,\\infty\\)) as \\(\\mathcal M\\) is closed under complements and intersections, \\((a,b) = (-\\infty, b) \\cap (-\\infty, a)^c\\).</p>
<p>Let \\(E \\subseteq R\\) and assume \\(a \\notin E\\), we have \\(E = (E\\cap (-\\infty, a)) \\cup (E \\cap(a, \\infty))\\), then the \\(\\leq\\) follows by subadditivity. We only need to show \\[\\mu^\\star(E) \\geq \\mu^\\star(E \\cap (-\\infty, a)) + \\mu^\\star(E \\cap (a, \\infty))\\]Note that  In other words, we are considering the two regions intersected by the ray \\((-\\infty, a)\\), and covering them with separate open intervals. The final inequality comes form the fact that the outer measure as an infimum over all coverings. Taking the infimum of the LHS, we obtain exactly what we wanted to show. Therefore indeed we have shown that any open intervals is a subset of \\(\\mathcal M\\).</p>
<p>To conclude our construction of the Lebesgue measure, we defined an outer measure, by step 4 (Carathadory) we obtain a measure space \\((R, \\mathcal M, \\mu^\\star\\vert_{\\mathcal M})\\) where \\(\\mathcal M\\) is the set of all \\(\\mu^\\star\\)-measurable sets. By step 3, we have that the outer measure of intervals are given by their length, and by step 5 we have the Borel set being a subset of \\(\\mathcal M\\), thus restricting \\(\\mu^\\star\\) from \\(\\mathcal M\\) to \\(\\mathcal B\\) gives us the measure space \\((R, \\mathcal B, \\mu^\\star \\vert_{\\mathcal B})\\). By definition from the outer measure, it is also translation invariant.</p>
<div class="card card-remark"><div class="card-label">When someone refers to the Lebesgue measure, what two spaces could they be referring to?</div><p>Either the measure space \\((R, \\mathcal M, \\mu^\\star\\vert_{\\mathcal M})\\) where \\(\\mathcal M\\) is the set of all \\(\\mu^\\star\\)-measurable sets, or the measure space \\((R, \\mathcal B, \\mu^\\star \\vert_{\\mathcal B})\\).</p></div>
<hr class="lecture-sep">
<p>To prove Caratheodory's theorem, we first need to show that \\(\\mathcal M\\) is a \\(\\sigma\\)-algebra. To do so, it suffices to first show that \\(\\mathcal M\\) is an algebra, and then show that it is closed under countable unions (remind yourself of the definitions from Lecture 1 - Sigma-algebras, the Borel algebra and the Dynkin pi-lambda theorem).</p>
<div class="card card-remark"><div class="card-label">Outline the proof for Caratheodory's theorem</div><ol><li>First show that \\(\\mathcal M\\) is an algebra.</li><li>Show that the outer measure is finitely additive by applying Caratheodory's criterion to \\(E = A\\cup B\\) with \\(A, B\\) disjoint.</li><li>Show that \\(\\mathcal M\\) is a sigma-algebra. The only difficult part here is showing that countable union of disjoint (wlog we can assume they are disjoint, remind yourself whhy) \\(\\mu^\\star\\) measurable sets is also in \\(\\mathcal M\\). Since the outer-measure is only countably subadditive, we have to prove that it is also countably additive for disjoint sets.</li><li>Show that \\(\\mu^\\star\\) is countably additive and thus forms a measure space. (this follows from the proof in 3) where by the squeeze theorem we have countably additivity for disjoint sets).</li><li>Show that the measure space is complete.</li></ol></div>
<h4>1) <strong>\\(\\mathcal M\\) is an algebra</strong>:</h4>
<p><strong>(i)</strong> \\(\\emptyset \\in \\mathcal{M}\\) is immediate.</p>
<p><strong>(ii)</strong> \\(\\mathcal{M}\\) is closed under complementation since the definition of \\(\\mu^*\\)-measurability is symmetric in \\(A\\) and \\(A^c\\).</p>
<p><strong>(iii)</strong> We need to show \\(A, B \\in \\mathcal{M}\\) implies \\(A \\cup B \\in \\mathcal{M}\\) (the actual definition for an algebra is that it is closed under finite unions, but as we have shown in an earlier exercise, it suffices to show it holds for union of two sets by induction) Fix \\(E \\subseteq X\\). Note that:</p>
<p>\\[A \\cup B = (A \\cap B) \\cup (A^c \\cap B) \\cup (A \\cap B^c)\\]</p>
<p>This is a disjoint union of three regions — sets in both \\(A\\) and \\(B\\), sets only in \\(B\\), and sets only in \\(A\\) — which together cover everything in \\(A \\cup B\\). Using subadditivity:</p>
<p>\\[\\mu^<em>(E \\cap (A \\cup B)) + \\mu^</em>(E \\cap (A \\cup B)^c) \\leq \\mu^<em>(E \\cap (A \\cap B)) + \\mu^</em>(E \\cap (A^c \\cap B)) + \\mu^<em>(E \\cap (A \\cap B^c)) + \\mu^</em>(E \\cap (A^c \\cap B^c))\\]</p>
<p>Applying measurability of \\(A\\) to \\(E \\cap B\\) for the first two terms:</p>
<p>\\[\\mu^<em>(E \\cap (A \\cap B)) + \\mu^</em>(E \\cap (A^c \\cap B)) = \\mu^*(E \\cap B)\\]</p>
<p>and to \\(E \\cap B^c\\) for the last two terms:</p>
<p>\\[\\mu^<em>(E \\cap (A \\cap B^c)) + \\mu^</em>(E \\cap (A^c \\cap B^c)) = \\mu^*(E \\cap B^c)\\]</p>
<p>Hence the right hand side equals \\(\\mu^<em>(E \\cap B) + \\mu^</em>(E \\cap B^c) = \\mu^*(E)\\), where the last equality follows from measurability of \\(B\\). This gives:</p>
<p>\\[\\mu^<em>(E \\cap (A \\cup B)) + \\mu^</em>(E \\cap (A \\cup B)^c) \\leq \\mu^*(E)\\]</p>
<p>The reverse inequality \\(\\mu^<em>(E) \\leq \\mu^</em>(E \\cap (A \\cup B)) + \\mu^*(E \\cap (A \\cup B)^c)\\) follows immediately from subadditivity, since \\((E \\cap (A \\cup B)) \\cup (E \\cap (A\\cup B)^c) = E\\). Together these give equality, so \\(A \\cup B \\in \\mathcal{M}\\). \\(\\square\\)</p>
<h4>2) \\(\\mu^\\star\\) is finitely additive on \\(\\mathcal M\\).</h4>
<p>If \\(A, B \\in \\mathcal{M}\\) are disjoint, then applying the Carathéodory criterion for \\(A\\) with test set \\(E = A \\cup B\\):</p>
<p>\\[\\mu^<em>(A \\cup B) = \\mu^</em>((A \\cup B) \\cap A) + \\mu^<em>((A \\cup B) \\cap A^c) = \\mu^</em>(A) + \\mu^*(B)\\]</p>
<p>where \\((A \\cup B) \\cap A = A\\) and \\((A \\cup B) \\cap A^c = B\\) by disjointness. Finite additivity for \\(n\\) disjoint sets \\(A_1, \\ldots, A_n \\in \\mathcal{M}\\) follows by induction.</p>
<h3>3) \\(\\mathcal{M}\\) is a \\(\\sigma\\)-algebra</h3>
<p>The only additional criterion imposed by the \\(\\sigma\\)-algebra over the algebra is closure under countable unions.</p>
<p>Since \\(\\mathcal{M}\\) is already an algebra, it suffices to show that if \\(A_1, A_2, \\ldots \\in \\mathcal{M}\\) are disjoint, then \\(\\bigcup_i A_i \\in \\mathcal{M}\\). This is without loss of generality since any countable union can be made disjoint via:</p>
<p>\\[\\bigcup_i A_i = \\bigcup_i \\left(A_i \\setminus \\bigcup_{j < i} A_j\\right)\\]</p>
<p>where each piece \\(A_i \\setminus \\bigcup_{j<i} A_j \\in \\mathcal{M}\\) since \\(\\mathcal{M}\\) is an algebra.</p>
<p>Now define \\(B_n := \\bigcup_{i=1}^n A_i\\) and \\(B := \\bigcup_i A_i\\). Applying measurability of \\(A_n\\) with test set \\(E \\cap B_n\\):</p>
<p>\\[\\mu^<em>(E \\cap B_n) = \\mu^</em>(E \\cap B_n \\cap A_n) + \\mu^<em>(E \\cap B_n \\cap A_n^c) = \\mu^</em>(E \\cap A_n) + \\mu^*(E \\cap B_{n-1})\\]</p>
<p>where we used \\(B_n \\cap A_n = A_n\\) and \\(B_n \\cap A_n^c = B_{n-1}\\) by disjointness. Repeating inductively:</p>
<p>\\[\\mu^<em>(E \\cap B_{n-1}) = \\mu^</em>(E \\cap A_{n-1}) + \\mu^<em>(E \\cap B_{n-2})\\] \\[\\vdots\\] \\[\\mu^</em>(E \\cap B_1) = \\mu^*(E \\cap A_1)\\]</p>
<p>Chaining everything together:</p>
<p>\\[\\mu^<em>(E \\cap B_n) = \\sum_{i=1}^n \\mu^</em>(E \\cap A_i) \\tag{2}\\] which is what we would expect (but note that this doesnt follow immediately from the definition of an outer measure, since its only countably subadditive)</p>
<p>where we inserted (2) and then used countable subadditivity of the outer measure to get the inequality in the last line since \\(B^c \\subseteq B_n^c\\).</p>
<p>Using measurability of \\(B_n\\) together with (2) and subadditivity and definition of B in last step.</p>
<h4>4) Show that \\(\\mu^\\star\\) is countably additive on \\(\\mathcal M\\) and thus a measure space.</h4>
<p>Remember that a measure space is the triple \\((X, \\mathcal M, \\mu^\\star)\\) where \\(\\mu^\\star(\\emptyset) = 0\\) and \\(\\mu^\\star(\\bigcup_i A_i) = \\sum_i \\mu^\\star(A_i)\\). \\(\\mu^\\star(\\emptyset) = 0\\) is satisfied definitionally. From the earlier proof, we had</p>
<p>Now we can take \\(E = B\\) as defined earlier, and that gives us \\(\\mu^\\star(B) = \\sum_{i=1}^\\infty \\mu^\\star(A_i)\\).</p>
<h4>5) Show that the measure space is complete</h4>
<p>A measure space is considered complete if subsets of nullsets are also nullsets, see Courses/Integration theory/Lecture notes/Lecture 2 - General measure theory and Caratheodory's theorem.</p>
<p>What we want to show is that if we have \\(B \\in \\mathcal M\\) where \\(\\mu^\\star(B) = 0\\) and \\(A \\subseteq B\\), then \\(A \\in \\mathcal M\\), that is, \\(A\\) satisfies \\[\\mu^\\star(E) = \\mu^\\star(E \\cap A) + \\mu^\\star(E \\cap A^c)\\] for any \\(E \\subseteq X\\).</p>
<p><strong>Proof.</strong> The \\(\\leq\\) direction follows immediately from countable subadditivity of \\(\\mu^\\star\\), since \\((E\\cap A)\\cup(E\\cap A^c) = E\\).</p>
<p>For \\(\\geq\\): since \\(A\\subseteq B\\) and \\(\\mu^\\star(B)=0\\), monotonicity gives \\[\\mu^\\star(E\\cap A) \\leq \\mu^\\star(A) \\leq \\mu^\\star(B) = 0\\] so \\(\\mu^\\star(E\\cap A) = 0\\). Also \\(E\\cap A^c \\subseteq E\\), so by monotonicity \\(\\mu^\\star(E\\cap A^c)\\leq\\mu^\\star(E)\\). Therefore: \\[\\mu^\\star(E\\cap A) + \\mu^\\star(E\\cap A^c) = 0 + \\mu^\\star(E\\cap A^c) \\leq \\mu^\\star(E)\\] Combining both directions gives equality, so \\(A\\in\\mathcal{M}\\), and since \\(\\mu^\\star(A)=0\\) the measure is complete. \\(\\square\\)</p>
<h2>Relationship between the Borel set and \\(\\mathcal M\\). </h2>
<p>There are Lebesgue measurable sets that are not Borel sets. We will prove this later.</p>
<div class="card card-remark"><div class="card-label">What is the relationship between Lebesgue measurable sets and Borel sets?</div><p>There are Lebesgue measurable sets which are not Borel measurable. This is shown in one of the exercises using the function \\(g(x) = F_c(x) + x\\).</p>
<p>Remember that during the construction of Lebesgue measurable sets, we are using Caratheodory which gives us a complete measure space. When restricted to the Borel sigma-algebra, the completeness is no longer preserved. Thus there are subsets of nullsets which are not Borel sets. An example of this is the Cantor set which has cardinality \\(|\\mathbb R|\\) and thus \\(2^{|\\mathbb R|}\\) subsets, but the cardinality of the Borel-sigma algebra is \\(|\\mathbb R|\\), and those most of Cantor subsets are Lebesgue but not Borel sets.</p></div>
<p><em>One way to characterize the Lebesgue measure is to first define it on Borel sets, that is, all sets obtained by countably unions, complements, and intersections, from the open intervals, s.t. it assigns usual length to open intervals. The Lebesgue measure can then be obtained by completing the Borel measure by assigning zero measure to all subsets of Borel sets that already have zero measure. From this perspective, we understand that the Borel sigma algebra is a proper subsets of the Lebesgue sigma algebra (see the earlier lecture). The construction we just derived based on Caratheodory, i.e. \\((\\mathbb R, \\mathcal M, \\mu^\\star \\vert_{\\mathcal M})\\) is a complete measure space, whereas \\((\\mathbb R, \\mathcal B, \\mu^\\star \\vert_{\\mathcal B})\\) is not (both measures are identical except they are restricted to different domains). For example, the Cantor set has the same cardinality as the reals, and its powerset (collection of all subsets) has greater cardinality of the reals, which exceed the number of Borel sets. Thus, there are more subsets than \\(\\mathcal B\\) can contain, and thus fails completeness. We have also shown that it is not possible to extend the Lebesgue measure to all \\(\\mathcal P(\\mathbb R)\\) while retaining translation invariance and countable additivity.</em> The</p>
<h2>The uniqueness of the Lebesgue measure on \\(\\mathcal B\\).</h2>
<p>The uniqueness is shown using Dynkin's \\(\\pi-\\lambda\\) theorem.</p>
<div class="card card-thm"><div class="card-label">Theorem 3.26 — Uniqueness theorem for measure on \\((X, \\sigma(I))\\)</div><p>Let \\(X\\) be a set and \\(\\mathcal{I}\\) be a \\(\\pi\\)-system on \\(X\\). If \\(\\mu_1\\) and \\(\\mu_2\\) are two measures on \\((X, \\sigma(\\mathcal{I}))\\) such that:</p>
<p>\\[\\mu_1(X) = \\mu_2(X) < \\infty\\]</p>
<p>and</p>
<p>\\[\\mu_1(I) = \\mu_2(I) \\quad \\forall I \\in \\mathcal{I}\\]</p>
<p>then \\(\\mu_1 = \\mu_2\\).</p></div>
<p>Applying this to \\(X = [0, 1]\\) and \\(I\\) being the set of open intervals implies that there is only one measure on \\(([0, 1], B[0,1])\\) which agrees with "length" on intervals. Note that the set of open intervals is a \\(\\pi\\)-system, as finite intersections of open intervals remain open. Thus, the Lebesgue measure is the unique measure that assigns length to intervals.</p>
<p><strong>Proof of theorem 3.26</strong></p>
<p>Define \\[D = \\{A \\in \\sigma(I) : \\mu_1(A) = \\mu_2(A)\\}\\]in other words the collection of all subsets of the sigma-algebra generated by the \\(\\pi\\)-system \\(I\\) such that the measures agree. We want to show that \\(D = \\sigma(I)\\), in other words, that all measurable sets of the sigma algebra agree irrespective of \\(\\mu_1\\) or \\(\\mu_2\\).</p>
<p>As per usual, to prove that two sets are identical, we have to show that they are contained in each other. Clearly from the way we defined \\(D\\), we have \\(D \\subseteq \\sigma(I)\\), and thus what remains is to prove the opposite containment \\(\\sigma(\\mathcal I) \\subseteq D\\). This requires three steps:</p>
<ol><li>We observe that \\(D\\) is a \\(\\mathcal D\\)-system.</li></ol>
<p>See definition 3.7 in Lecture 1 - Sigma-algebras, the Borel algebra and the Dynkin pi-lambda theorem. By assumption we have that \\(X \\in \\mathcal D\\) as \\(\\mu_1(X) = \\mu_2(X)\\) by assumption. Let now \\(E,F \\in \\mathcal D\\), i.e. they satisfy \\(\\mu_1(E) = \\mu_2(E)\\) and \\(\\mu_1(F) = \\mu_2(F)\\), and \\(E\\subseteq F\\), our question is whether \\(F\\setminus E \\in \\mathcal D\\). So we check</p>
<p>\\[\\mu_1(F\\setminus E)  = \\mu_1(F) - \\mu_1(E) =\\mu_2(F) - \\mu_2(E) = \\mu_2(F\\setminus E)\\] Finally we have to check whether \\(E_1 \\subseteq E_2 \\subseteq E_3 \\subseteq \\cdots\\) and \\(E_i \\in \\mathcal{D}\\) for all \\(i\\) imply \\(\\bigcup_i E_i \\in \\mathcal{D}\\). Using continuity from below we have \\[\\mu_1(\\bigcup_i E_i) = \\lim_{n\\rightarrow \\infty} \\mu_1(E_n) = \\lim_{n\\rightarrow \\infty} \\mu_2(E_n) = \\mu_2(\\bigcup_i E_i)\\] and thus \\(D\\) is a Dynkin-system.</p>
<ol><li>We observe that \\(\\mathcal I \\subseteq D\\) by assumption</li></ol>
<p>By assumption \\(\\mu_1 = \\mu_2\\) on all open intervals and thus \\(\\mathcal I \\in \\mathcal D\\).</p>
<ol><li>And finally we apply Dynkin's \\(\\pi-\\lambda\\) theorem for the equality and steps 1 and 2 for the containment, we have \\(\\sigma(I) = \\mathcal D(I)\\subseteq D\\)</li></ol>
<p>Since we are given that \\(\\mathcal I\\) is a \\(\\pi\\)-system, we can apply Dynkin's \\(\\pi-\\lambda\\) theorem to state  \\[\\mathcal{D}(\\mathcal{I}) = \\sigma(\\mathcal{I})\\] Remember now that \\(\\mathcal D(\\mathcal I)\\) is the <em>smallest</em> \\(\\lambda\\)-system containing \\(\\mathcal I\\), and since we showed that D (also a \\(\\lambda\\)-system) contains \\(\\mathcal I\\), we must have \\(\\sigma(\\mathcal{I}) = \\mathcal D(\\mathcal I) \\subseteq \\mathcal D\\).  This completes the proof.</p>
<h4>3.7 Nonmeasurable sets</h4>
<p>It is natural to ask if \\(\\mathcal M\\) (the set of all \\(\\mu^\\star\\)-measurable sets) contains all sets, that is, whether all sets are Lebesgue measurable. It will turn out that \\(\\mathcal M\\) can not be everything (assuming the axiom of choice), in particular, it will fail countable additivity under disjoint sets.</p>
<div class="card card-remark"><div class="card-label">Does \\(\\mathcal M\\) (the set of all \\(\\mu^\\star\\)-measurable sets)  contain all sets, that is, whether all sets are Lebesgue measurable?</div><p>No, there are constructions like the Vitali set which is not Lebesgue measurable (assuming axiom of choice).  [!CARD] Theorem 3.27 Non-existence of translation invariant measure on R.</p>
<div class="card card-thm"><div class="card-label">There does not exist a translation invariant measure on all subsets of R which gives length for intervals.</div><p><strong>Proof</strong> Assume \\(\\mu\\) is such a measure. Then, define an equivalence relation on \\([0,1]\\) where we identify \\(x \\sim y\\) if \\(x-y \\in \\mathbb Q\\). The equivalence class of \\(x\\) is then given by all points shifted by some rational contained in \\([0,1]\\), i.e. \\[[x] = \\{x + q: q \\in \\mathbb Q\\} \\cap [0,1]\\]  Since the rationals are countable, \\([x]\\) is countable, but the number of equivalence classes is uncountable since the reals are uncountable. Let \\(A\\) consist of one element from each equivalence class (<strong>this assumes the axiom of choice, meaning if you have an infinite number of sets, the axiom says you can still make a single choice from every single set at the same time</strong>). This set is known as the <em>Vitali set</em>. We ask ourselves what \\(\\mu(A)\\) is. We will see that we will arrive at a contradiction. Step 1: \\(\\mu(A) > 0\\). We first claim: \\[[0,1] \\subseteq \\bigcup_{q \\in [-1,1] \\cap \\mathbb{Q}} (A + q)\\] To see this, take \\(x\\in[0,1]\\) and \\(y \\in A\\) with \\(x-y \\in \\mathbb Q\\), then \\(x = y + (X-y) \\in A + (x-y)\\) but since \\(x-y \\in [-1, 1] \\cap Q\\), we obtain (4). Assuming the measure is translation invariant however means \\(\\mu(A+q) = \\mu(A)\\), therefore if \\(\\mu(A) = 0\\) and countable additivity, the measure of the RHS of \\((4)\\) would be 0, but this can not be since \\(\\mu\\) of the LHS is 1. Hence \\(\\mu(A) > 1\\) at least, since \\([0,1]\\) is a subset. Step 2: \\(\\mu(A) = 0\\). Clearly we have that \\[\\bigcup_{q \\in [0,1] \\cap \\mathbb{Q}} (A + q) \\subseteq[0,2]\\] Note that the sets in the union of the LHS are disjoint. Assume some \\(u \\in A + q_1\\) and in \\(A + q_2\\) we would have \\(u = a_1 + q_1 = a_2 + q_2\\) with \\(a_1, a_2 \\in A\\), then \\(a_1-a_2 = q_1-q_2 \\in \\mathbb Q\\) which would imply that \\(a_1 \\sim a_2\\). But remember that the Vitali set only contains a single element from the equivalence class, and thus we arrive at a contradiction. Each term therefore has measure \\(\\mu(A)\\). We therefore have an infinite sum of \\(\\mu(A)\\), which if \\(\\mu(A)>0\\) diverges to infinity. Since the RHS has measure \\(2\\), this is clearly a contradiction. The two steps give us a contraction. QED.</p></div></div>

<h2>Banach-Tarski paradox</h2>
<div class="card card-remark"><div class="card-label">Does there exist a translation invariant and <em>finitely</em> additive measure on all subsets of R?</div><p>Yes, a translation invariant and finitely additive measures exist in R and. In R^2 translation invariance refers to all isometries of space and assigns standard volume to squares. Actually, one needs to go to 3 dimensions to obtain Banach-Tarski paradoxes.  [!CARD] Briefly explain the Banach-Tarski paradox. No translation invariant and finitely additive measure exists on all subsets of \\(R^3\\). Assuming instead, by contradiction, that the statement is true, you can construct a finite decomposition of a ball into disjoint subsets which can be put together two yield two identical copies of the original ball (this decomposition is the ingredient in the proof and is mathematically possible), leading to a \\(1=2\\) situation. The paradox lies in the fact that intuitively speaking, we expect that that moving the parts around would preserve the volume, except here the subsets are chosen carefully such that their volumes are not preserved, in fact, you can nto define volumes of the considered substes.</p></div>
<h4>Other important constructions of measures</h4>
<div class="card card-def"><div class="card-label">Definition — Premeasure</div><p>If \\(X\\) is a set and \\(\\mathcal{A}\\) is an algebra on \\(X\\), a function \\(\\mu_0 : \\mathcal{A} \\to [0, \\infty]\\) is called a <strong>premeasure</strong> if:</p>
<ol><li>\\(\\mu_0(\\emptyset) = 0\\)</li></ol>
<ol><li>If \\(A_1, A_2, \\ldots\\) are pairwise disjoint elements of \\(\\mathcal{A}\\) and if \\(\\bigcup_i A_i \\in \\mathcal{A}\\), then:</li></ol>
<p>\\[\\mu_0\\!\\left(\\bigcup_i A_i\\right) = \\sum_i \\mu_0(A_i)\\]</p></div>
<p>Had \\(\\mathcal A\\) been a \\(\\sigma\\)-algebra, this would have just been our usual measure.</p>
<div class="card card-thm"><div class="card-label">Theorem 3.29 — Extension of Premeasure to Measure</div><p>If \\(\\mu_0\\) is a premeasure on \\((X, \\mathcal{A})\\), then there exists a measure \\(\\mu\\) on \\((X, \\sigma(\\mathcal{A}))\\) with: \\[\\mu(A) = \\mu_0(A) \\quad \\text{for all } A \\in \\mathcal{A}\\]</p>
<p>If \\(\\mu_0\\) is \\(\\sigma\\)-finite on \\(X\\), then \\(\\mu\\) is unique.</p>
<p><em>(Uniqueness can fail in the non-\\(\\sigma\\)-finite case.)</em></p></div>
<p>The theorem is an existence theorem. It tells us that if we have a premeasure on an algebra, we can generate a minimal \\(\\sigma\\)-algebra from \\(\\mathcal A\\) on which the measures agree. In particular, if the premeasure is \\(\\sigma\\)-finite, then it is also unique.</p>
<h4>Distribution functions for Borel sets</h4>
<div class="card card-thm"><div class="card-label">Proposition 3.30 — CDF of a Borel Measure</div><p>Let \\(\\mu\\) be a finite Borel measure on \\([0,1]\\) and define \\(F: [0,1] \\to [0, \\mu([0,1])]\\) by: \\[F(x) := \\mu([0,x])\\]</p>
<p>Then \\(F\\) is <strong>weakly increasing</strong> and <strong>right continuous</strong>.</p>
<p><strong>Proof.</strong></p>
<p><strong>Weakly increasing:</strong> Monotonicity of measures implies \\(F\\) is weakly increasing. For \\(x \\leq y\\): \\[[0,x] \\subseteq [0,y] \\implies \\mu([0,x]) \\leq \\mu([0,y]) \\implies F(x) \\leq F(y)\\]</p>
<p><strong>Right continuity:</strong> Follows from continuity from above. For fixed \\(t\\): \\[\\lim_{s \\downarrow t} F(s) = \\lim_{s \\downarrow t} \\mu([0,s]) = \\mu([0,t]) = F(t)\\]</p>
<p>where the second equality uses continuity from above: \\([0,s] \\downarrow [0,t]\\) as \\(s \\downarrow t\\), and \\(\\mu([0,t]) < \\infty\\). \\(\\square\\)</p></div>
<p>In the case of the Lebesgue measure, we simply have \\(F(x) = x\\).</p>
<p>It tells us that given a measure, we have an associated distribution function.</p>
<div class="card card-ex"><div class="card-label">Exercise 3.14</div><ol><li>Verify the middle equality of \\((6)\\) in detail:</li></ol>
<p>\\[\\lim_{s \\downarrow t} \\mu([0,s]) = \\mu([0,t])\\]</p>
<ol><li>Show that \\(F\\) is not necessarily left continuous, and moreover that:</li></ol>
<p>\\[F(t) - \\lim_{s \\uparrow t} F(s) = \\mu(\\{t\\})\\] [!CARD] Proposition 3.31 — Borel Measure from CDF</p>
<div class="card card-thm"><div class="card-label">Theorem</div><p>Let \\(F\\) be a nonneg­ative, weakly increasing and right continuous function on \\([0,1]\\) mapping into \\([0, \\infty)\\). Then there exists a unique finite Borel measure \\(\\mu\\) on \\([0,1]\\) satisfying: \\[F(x) := \\mu([0,x])\\]</p></div></div>
<p>The proposition tells us that given a distribution function, we have an associated measure.</p>
<p>It turns out that if \\(F(x) = x\\), we get the Lebesgue measure. The \\(F\\) corresponding to a measure \\(\\mu\\) will be denoted by \\(F_\\mu\\) (prop 3.30) and the \\(\\mu\\) corresponding to a given \\(F\\) as above will be denoted by \\(\\mu_F\\) (prop 3.31)</p>
<h4>The Cantor set, the Cantor ternary function and the Cantor measure</h4>
<p>The Cantor set is constructed by splitting the \\([0,1]\\) interval in three intervals, and removnig the middle third. The process is then repeated for the two intervals, each time removnig the middle third from each of the intervals from the previous set. \\(C_n\\) then consists of \\(2^n\\) disjoint closed intervals, each of length \\(1/3^n\\). The Cantor set is defined to be \\[C\\equiv \\bigcap_n C_n\\] \`\`<code>jsx: <CantorSet /> </code>\`\`</p>
<div class="card card-thm"><div class="card-label">Proposition 3.33. Mention four properties of the Cantor set</div></div>
<p>Any closed set in R without isolated points is uncountable, and thus the Cantor set is uncountable by proposition 3.33.</p>
<p>Proof of prop 3.33:</p>
<ol><li>Since it is closed, it must be nonempty compact set by elementary topology.</li><li>Since \\(C_n\\) consists of \\(2^n\\) disjoint closed intervals of length \\(1/3^n\\), the \\(C_n\\) has Lebesgue measure \\((2/3)^n\\) and thus \\(C\\) has Lebesgue measure 0.</li><li><strong>TODO: show that it has no isolated points</strong></li></ol>
<p>We now want to define the Cantor ternary function, or Devil's staircase. The idea is to create a function with \\(f(0) = 0, f(1) = 1, f' = 0\\) that is increasing (and also demand it to be continuous!!). The Cantor ternary function \\(F_c\\) is defined as the limit of the sequence of function \\((f_n)\\) with \\(f_0(x) = x\\) and \\(f_1\\) constant \\(1/2\\) on middle interval and otherwise linear, \\(f_2\\) will be constant \\(1/4\\) on \\((1/9, 2/9)\\) and constant 1/2 on \\((1/2, 2/3)\\) and constant \\(3/4\\) on \\((7/9, 8/9)\\), and otherwise linear.</p>
<p>\`\`<code>jsx: <DevilsStaircase /> </code>\`\`</p>
<div class="card card-thm"><div class="card-label">Theorem 3.34 — Cantor Ternary Function</div><p>The sequence \\((f_n)\\) converges uniformly to a (necessarily continuous) limit function \\(F_C\\), which we call the <strong>Cantor ternary function</strong>. [!CARD] Corollary 3.35 — Properties of the Cantor Ternary Function</p>
<p>[!theorem] <strong>(a)</strong> \\(F_C\\) is a weakly increasing function on \\([0,1]\\) with \\(F_C(0) = 0\\) and \\(F_C(1) = 1\\) <strong>(b)</strong> \\(F_C\\) is continuous. <strong>(c)</strong> \\(F_C' = 0\\) (Lebesgue)-a.e. on \\([0,1]\\).</p></div>
<h4>Proof of Corollary 3.35</h4>
<p>Since each \\(f_n\\) is 0 at 0 and 1 and weakly increasing, the same is true for the limit \\(F_C\\). It is continuous by theorem 3.34. Take \\(x\\notin C\\), then there is an \\(n\\) such that \\(x \\notin C_n\\) since \\(C = \\bigcap_n C_n\\), in which case \\(f_n\\) is constant in an interval around \\(x\\) (since it corresponds to a point that was removed in the construction of the Cantor set, and those intervals where assigned to be constant). Since \\(f_n\\) is constant on that interval, it follows that \\(f_m\\) is also constant on that interval for all \\(m\\geq n\\), and this is it certainly true for \\(F_c\\) and hence \\(F_C'(x) = 0\\). Since \\(x \\notin C\\) implies \\(F'_c(x) = 0\\) we have that \\(m\\{x\\in[0,1]:F'_c(x) \\neq 0\\}=m(C) = 0\\) since \\(C\\) has Lebesgue measure 0, but this is just the definition of the property  \\(F'_c(x) = 0\\) being true Lebesgue-a.e., thus (c) follows.</p>
<hr>
<p>We may now define the Cantor Ternary measure denoted by \\(\\mu_C\\) as follows \\[\\mu_C([0,x])\\equiv F_c(x)\\]using proposition 3.31 since \\(F_C\\) is continuous, weakly increasing and non-negative.</p>
<div class="card card-thm"><div class="card-label">Theorem 3.36. Properties of the Cantor ternary measure.</div><p>\\(\\mu_C\\) is a continuous measure and where \\(\\mu_C(C) = 1, \\mu_C(C^c) = 0\\).</p></div>
<p>To gain intuition for this result, note that \\[\\mu_C(C^c) = \\mu_C([0,1] \\setminus C) = \\mu_C(\\bigcup_{\\mathrm{removed \\ intervals}}) = \\sum_{\\mathrm{removed \\ intervals}} \\mu_C(I_k) = 0\\]where we used the fact that the intervals we removed are disjoint, and specifically, \\(F_c\\) is constant at each removed interval. Hence \\(\\mu(C) = 1\\).</p>
<p>The fact that it is continuous follows from the fact that \\(F_c\\) is continuous (both left- and right continuous). And since it is also left-continuous, this implies that there are no atoms and thus the measure space is complete.</p>
<h4>The Borel-Cantelli lemma (section 3.12)</h4>
<p>This lemma is useful, especially in probability theory.</p>
<div class="card card-def"><div class="card-label">Definition 3.37 — \\(\\limsup\\) and \\(\\liminf\\) of Sets</div><p>If \\(E_1, E_2, \\ldots\\) is a sequence of measurable sets in a measure space, we let:</p>
<p>\\[\\limsup E_i := \\bigcap_{n=1}^\\infty \\left(\\bigcup_{k=n}^\\infty E_k\\right)\\]</p>
<p>also written \\((E_n \\text{ i.o.})\\) — <strong>infinitely often</strong> — since \\(x \\in \\limsup E_i\\) if and only if \\(x\\) is contained in infinitely many \\(E_n\\)'s.</p></div>
<p>Note that definitionally, the limsup is also a measurable set since it is constructed from countable set operations.</p>
<div class="card card-remark"><div class="card-label">Give three examples of \\(\\limsup\\) applied to shrinking, expanding and moving intervals</div><p>Shrinking intervals: \\(E_n = [0,1/n]\\) has \\(\\limsup E_n = \\{0\\}\\) since that is the only element which occurs in infinitely many \\(n\\). Expanding intervals: Take \\(E_n = [0, 1-1/n]\\) whose \\(\\limsup E_n = [0,1)\\) since \\(x=1\\) is never in any \\(E_n\\).  Moving intervals: Take the typewriting sequence defined later in the course over the interval \\([0,1]\\), whose limsup is \\([0,1]\\).</p></div>
<p>Let \\(T_n \\equiv \\bigcup_{k=n}^\\infty E_k\\), then if \\(x\\in \\lim \\sup E_i\\), it must follow that \\(x\\in T_n\\) for all \\(n\\). This in turn implies that \\(x\\) appears in some \\(E_k\\) with \\(k\\geq 1\\). some \\(E_k\\) with \\(k\\geq 2\\) etc... In other words, \\(x\\) could be in every odd one, or it could be in \\(1_1, E_{10}, E_{100}\\) etc..., that is still infinitely often. It is thus all the points \\(x\\) that appear in infinitely many of the \\(E_n\\)'s.</p>
<div class="card card-thm"><div class="card-label">Lemma 3.38 — First Borel–Cantelli Lemma</div><p>Let \\(E_1, E_2, \\ldots\\) be a sequence of measurable sets in the measure space \\((X, \\mathcal{M}, m)\\). If: \\[\\sum_i m(E_i) < \\infty\\] then \\(m(\\limsup E_i) = 0\\).</p>
<p><strong>Proof.</strong> For each \\(n\\), by subadditivity: \\[m(\\limsup E_i) \\leq m\\!\\left(\\bigcup_{k=n}^\\infty E_k\\right) \\leq \\sum_{k=n}^\\infty m(E_k)\\] The first inequality follows from monotonicity using the fact that \\(\\limsup E_i \\subseteq \\bigcup_{k\\geq n} E_k\\) for some fixed \\(n\\) as it lies in the intersection.  Since \\(\\sum_i m(E_i) < \\infty\\), the tail \\(\\sum_{k=n}^\\infty m(E_k) \\to 0\\) as \\(n \\to \\infty\\). Hence \\(m(\\limsup E_i) = 0\\). \\(\\square\\)</p></div>
<p>From probabilistic view, it says that sum of probabilities of events is finite, the probability that infinitely many of them occur is zero (for any sequence of events). There is also a second Borel-Cantelli lemma which, if events are independent and the sum of their probabilities infinite, then the probability that infinitely many of them occur is 1. A consequence of the second Borel-Cantelli lemma is the infinite monkey theorem, discussed in Lecture 9 - Weak and strong laws of large numbers in probability theory.</p>
<div class="card card-remark"><div class="card-label">Does the converse statemenet of the first Borel-Cantelli lemma.</div><p>No. Take \\(E_n = [0,1/n]\\) where \\(\\limsup E_n = \\{0\\}\\) and \\(m(\\{0\\}) = 0\\) for any continuous measure, e.g. the Lebesgue measure on the reals and Borel-sigma algebra. Whereas \\(\\sum_n m(E_n) = \\sum_n 1/n = \\infty\\).</p></div>
