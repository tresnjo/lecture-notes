  html:`
<p>So far, we have discussed nonnegative measures. But can we also introduce a well-defined concept of a signed measure? Indeed we can.</p>
<div class="card card-def"><div class="card-label">Definition 7.1. A signed measure.</div><p>(i) \\(\\nu(\\emptyset) = 0\\) (ii) At most one of the values \\(\\pm \\infty\\) are assumed. (iii) If \\(A_1, A_2,...\\) pairwise disjoint elements of \\(\\mathcal M\\), then \\[\\nu(\\bigcup_i A_i) = \\sum_i \\nu(A_i)\\] where the sum on the RHS converges absolutely when the LHS is finite.</p></div>
<p>We compare this to the definition of a measure. First, note the additional criterion (ii), and the additional comment in (iii) that the RHS converges absolutely when the LHS is finite. The reason is related to what we discussed earlier, namely that there is no intrinsic ordering of the elements of the set, and consequently, neither should the measure of the union depend on that ordering. Absolute convergence is thus required.</p>
<p>For unsigned series, conditional convergence is not possible, so either the series is absolutely convergent or diverges to \\(+\\infty\\). For signed measures, we can have conditional convergence. Therefore whenever the LHS is finite, we must have that the RHS is absolutely convergence, since had it been conditionally convergent, we could as per the Riemann rearrangement theorem, rearrange the terms to attain any value.</p>
<p>Some remarks that follow from the definition:</p>
<ul><li>A measure is a signed measure.</li><li>If \\(\\mu_1, \\mu_2\\) are finite measures (or at least one is finite) then \\(\\mu_1-\\mu_2\\) is a signed measure.</li><li>Condition (ii) is there to avoid having \\(\\infty - \\infty\\). For example if \\(A, B\\) are disjoint sets where \\(\\nu(A) = \\infty\\) and \\(\\nu(B) = -\\infty\\) then \\(\\nu(A \\bigcup B)\\) is undefined.</li></ul>
<p>So far, a signed measure can feel somewhat uncomfortable, especially if we have made ourselves comfortable with the idea that a measure is something that assigns volumes to sets. However, it differences of measures turn out to be very common, and a difference of (finite) measures produces a signed measure, as seen in the exercise that follows.</p>
<div class="card card-ex"><div class="card-label">If \\(\\mu_1, \\mu_2\\) are finite measures (or at least one is finite), then the difference \\(\\mu_1-\\mu_2\\) is a signed measure.</div><p><strong>Proof</strong> Properties (i) and (ii) are clearly satisfied. Let \\(\\Delta \\mu := \\mu_1 - \\mu_2\\), then we have \\[\\Delta \\mu (\\bigcup_i A_i) = \\mu_1(\\bigcup_i A_i) - \\mu_2(\\bigcup_i A_i) = \\sum_i \\mu_1(A_i) - \\sum_i \\mu_2(A_i) = \\sum_i (\\mu_1 - \\mu_2)(A_i) = \\sum_i \\Delta \\mu(A_i)\\] where subtracting the series is only possible if at least one of them is finite (ok by assumption). Finally, when the LHS is finite, and at least one of measures is finite (say \\(\\mu_1\\)) we have \\(\\sum_i \\mu_1(A_i) < \\infty\\) since \\(A_i\\subseteq X\\) are disjoint and thus \\[\\sum_i |\\Delta \\mu(A_i) |\\leq \\sum_i \\mu_1(A_i) + \\sum_i \\mu_2(A_i) < \\infty\\] and thus it converges absolutely.</p></div>
<p>It turns out that every signed measure has the form \\(\\mu_1 - \\mu_2\\), both being measures with at least one being finite. This is the <strong>Jordan Decomposition Theorem</strong>. Before that, we first prove the Hahn Decomposition Theorem.</p>
<div class="card card-def"><div class="card-label">Definition 7.2. A positive and negative set.</div><p>[!CARD] Verify the statement "\\(A\\) being a positive set is a strictly stronger statement than \\(\\nu(A)\\geq 0\\)" with an example [!exercise] For example if we take \\[\\nu(A) = \\int_A (2x-1)dx\\] on \\(([0,1], \\mathcal B_[0,1])\\) then \\(\\nu([0,1]) = 0\\geq 0\\) whereas \\(\\nu([0, 1/2]) = -1/4 < 0\\). Thus being a positive set is a stronger statement. [!CARD] Two facts about signed measures. (i) Continuity from below and above for measures applies to signed measures. (ii) A measurable subset of a positive set is a positive set, and a countable union of positive set is a positive set. [!CARD] Theorem 7.3 (Hahn Decomposition Theorem) [!theorem] If \\(\\nu\\) is a signed measure on \\((X, \\mathcal M)\\) then \\(X\\) can be partitioned into two sets \\(P, N \\in \\mathcal M\\) (meaning \\(P \\cup N = X, P \\cap N = \\emptyset\\)) with \\(P\\) being a positive set and \\(N\\) a negative set. There is "almost uniqueness" in that if \\((P', N')\\) is another such partition, then \\(P \\Delta P'\\) and \\(N\\Delta N'\\) are each null sets.</p></div>
<p>By definition we have \\(A \\Delta B = (A \\setminus B) \\cup (B \\setminus A)\\) which are the points which belong to exactly one of the two sets \\(A\\) and \\(B\\). In other words, given a <em>signed measure space</em>, we can cleanly partition our \\(X\\) into a positive and negative measurable part, and this decomposition is unique up to nullsets.</p>
<div class="card card-remark"><div class="card-label">Give a simple example of a Hahn decomposition.</div><p>Consider \\(([0,1], \\mathcal B_{[0,1]})\\) with \\(m\\) being the Lebesgue measure and take \\(\\nu(A) := m(A \\cap [0, 3/4]) - m(A \\cap (3/4, 1])\\).  The Hahn decomposition is then given by \\(([0, 3/4], (3/4, 1])\\). A different decomposition is given by \\(P' = [0, 3/4)\\) and \\(N' = [3/4, 1]\\) since it is still a valid partition of \\([0,1]\\) and \\(P'\\Delta[0, 3/4] = \\{3/4\\}\\) which is a nullset.  Another example is for example \\(P' = [0,3/4]\\bigcup C\\) with \\(C\\) being the Cantor set and \\(N' = (3/4, 1] \\setminus C\\) which still partitions \\([0,1]\\) since \\[[0,3/4]\\cup C \\cup (3/4, 1] \\cap C^c = [0,1]\\] and they are disjoint and \\(P'\\Delta[0,3/4] = C\\) which is still a nullset.  [!CARD] Lemma 7.4. Existence of positive subset.</p>
<div class="card card-thm"><div class="card-label">Let \\(\\nu\\) be a signed measure on \\((X, \\mathcal M, \\nu)\\) which does not take the value \\(\\infty\\). If \\(\\nu(A) > 0\\), then there exists a measurable \\(B \\subseteq A\\) where \\(\\nu(B) > 0\\) and \\(B\\) is a positive set.</div></div></div>
<p>Take for example \\(X = \\{1,2,3\\}\\) and \\(\\mathcal M = 2^X\\) then take \\(\\nu(\\{1\\}) = 3\\) and \\(\\nu(\\{2\\}) = -1\\) and same for \\(3\\). Then \\(\\nu(X) = 1>0\\) but \\(\\{2\\}\\subseteq X\\) and \\(\\nu(\\{2\\}) = -1\\), thus \\(X\\) is not a positive set, although it has positive measure. But if we take \\(B = \\{1\\}\\) then indeed we have a subset which is also a positive set. From this perspective it makes sense, the positive and negative parts of \\(A\\) may give a positive contribution, but we can find a subset of these which only contribute positively. We can do this using a greedy algorithm, by just at each stage remove the most negative measurable subsets, define that as our new subset, remove the negative measurable subsets, and repeat until the resulting subset is positive.</p>
<p>For example take \\(([0,1], \\mathcal B_{[0,1]})\\) with \\(\\nu(A) = \\int_A (2x-1) dm(x)\\). If we take \\(A = [1/4, 1]\\) then \\(\\nu(A) > 0\\) but it is not a positive set since the density \\(2x-1 < 0\\) on \\([1/4, 1/2)\\), so why just not remove that interval and define \\(B = [1/2,1]\\subseteq A\\) which is measurable and also a positive set.</p>
<p>This is different from the two facts we mentioned earlier. The lemma says that we only know that the measure of \\(A\\) is positive, not that it is a positive set. However, it does guarantee that we can always find a subset of \\(A\\) which is positive.</p>
<div class="card card-def"><div class="card-label">Definition 7.5. Mutually singular measures.</div><p>[!CARD] Theorem 7.6. (Jordan decomposition theorem). [!theorem] If \\(\\nu\\) is a signed measure on \\((X, \\mathcal M)\\), then there exists unique measures \\(\\nu^+\\) and \\(\\nu^-\\) so that \\(\\nu^+ \\perp \\nu^-\\) and \\[\\nu = \\nu^+ - \\nu^-\\]</p></div>
<p>The measure \\(\\nu^+ + \\nu^-\\) is called the total variation of \\(\\nu\\) and is denoted by \\(|\\nu|\\). The Jordan decomposition theorem is essentially a corollary of the Hahn decomposition theorem where we define \\(\\nu^\\pm\\) as the restriction of \\(\\nu\\) to \\(P\\) (+) \\(N\\) (-) respectively. This is similiar to the decomposition of a function \\[f(x) = \\max(f(x), 0) - \\max(-f(x), 0) \\equiv f^+(x) - f^-(x)\\] <strong>Example:</strong></p>
<p>Why is \\(\\nu(A) = \\int_A (2x-1) dx\\) a signed measure?</p>
<ul><li>\\(\\nu(\\emptyset) = 0\\)</li><li>Since \\(2x-1\\) is bounded on \\([0,1]\\), it is a finite signed measure and thus never takes \\(\\pm \\infty\\).</li><li>Countable additivity follows from the fact that the integral and infinite sum can be interchanged by the Lebesgue dominated convergence theorem. \\[\\nu(\\bigcup_i A_i) = \\int f 1_A dx = \\int \\lim_{n\\rightarrow \\infty} f \\cdot 1_{\\bigcup_{i=1}^n A_i}\\]</li></ul>
<p>and in order to swap limit and integral, we need the LDCT. Since \\(g_n \\rightarrow f \\cdot 1_A\\) pw and \\(|f_n| \\leq |f|\\) for all n we can simply take \\(f\\) as our majorant function, and clearly \\(\\int |f| dx < \\infty\\) so \\(f\\) is also integrable. We may therefore write \\[=\\lim_{n\\rightarrow \\infty} \\int f_n dx = \\lim_{n\\rightarrow \\infty} \\sum_{i=1}^n \\int_{A_i} f dx = \\sum_{i=1}^\\infty \\nu(A_i)\\]</p>
<h5>Example 6: Cantor measure minus Lebesgue</h5>
<p>Define \\[\\nu = \\mu_c - m\\]on the measurable space \\(([0,1], \\mathcal B_{[0,1]})\\) then the Hahn decomposition is simply \\(P = C\\) (the Cantor set) and \\(N= C^c\\) and then we simply have \\(\\nu^+(A) = \\mu_c(A \\cap C)\\) and \\(\\nu^{-1}(A) = m(A \\cap C^c)\\) for the Jordan decomposition.</p>
<hr class="lecture-sep">
<div class="card card-def"><div class="card-label">Definition 7.7. Absolute continuity.</div></div>
<p>Note that it does not mean that \\(\\nu \\leq \\mu\\) or vice versa. For example if we have \\(\\mu\\) is the Lebesgue measure on \\([0,1]\\) and \\(\\nu\\) is two times the Lebesgue measure on the same interval, we have both \\(\\nu << \\mu\\) and \\(\\mu << \\nu\\).</p>
<div class="card card-remark"><div class="card-label">Construct a simple example of a measure absolutely continuous wrt to \\(\\mu\\).</div><p>Consider a measure space \\((X, \\mathcal M, \\mu)\\) and a function \\(f\\in L^+((X, \\mathcal M, \\mu))\\) then take \\[\\nu(A) := \\int_A f(x) d\\mu(x) \\tag{1}\\] Proving that it is a measure can be done by defining \\(g_n : = f 1_{\\bigcup_{i=1}^n A_i}\\) which forms an increasing sequence of measurable functions that converge to \\(f \\cdot 1_{\\bigcup_i A_i}\\) pw which allows us to apply the MCT \\[\\nu\\left(\\bigcup_i A_i\\right) = \\int f \\cdot \\mathbf{1}_{\\bigcup_i A_i} \\, d\\mu = \\int \\lim_{n\\to\\infty} g_n \\, d\\mu \\underbrace{=}_{\\text{MCT}} \\lim_{n\\to\\infty} \\int g_n \\, d\\mu = \\lim_{n\\to\\infty} \\sum_{i=1}^n \\int_{A_i} f \\, d\\mu = \\sum_{i=1}^\\infty \\nu(A_i)\\] If \\(\\mu(A) = 0\\), then \\(\\nu(A) = \\int_A f d\\mu = 0\\) and thus \\(\\nu << \\mu\\).</p></div>
<p>(1) is often simply just denoted by \\(f\\mu\\). In fact, any measure which is absolutely continuous with respect to \\(\\mu\\) has this form assuming \\(\\sigma\\)-finiteness.</p>
<div class="card card-thm"><div class="card-label">Theorem 7.8. (The Radon-Nikodym theorem)</div><p>Morever, \\(f_0\\) is unique in the sense that if \\(g_0\\) is another such function, then \\[\\mu(\\{x:f_0(x) \\neq g_0(x)\\})=0\\]In other words \\(\\mu\\) is defined up to a \\(\\mu\\)-null set. Thus any two \\(f_0, g_0\\) agree \\(\\mu\\)-a.e. [!CARD] Remarks about Radon-Nikodym's theorem</p>
<ol><li>We call \\(f_0\\) in the above theorem for the Radon-Nikodym derivative of \\(\\nu\\) with respect to \\(\\mu\\).</li><li>If \\(\\mu\\) is Lebesgue measure on \\((R, \\mathcal B)\\) and \\(\\nu\\) is the distribution of a random variable which is absolutely continuous with respect to \\(\\mu\\), then \\(f_0\\) is simply the probability density function from elementary probability.</li><li>The theorem is false in general without the \\(\\sigma\\)-finite assumption on \\(\\mu\\).</li><li>It turns out that \\(\\sigma\\)-finiteness on \\(\\nu\\) is not needed provided that \\(f_0\\) is allowed to take the value \\(\\infty\\).</li></ol></div>
<p>Note that the CDF can always be defined from the distribution of our RV by simply defining \\[F_X(x) = \\mu_X(-\\infty, x) = P(X^{-1}(-\\infty, x))\\]whereas the PDF of a R.V. is only defined if it is absolutely continuous wrt to the Lebesgue measure. This also means that given a CDF \\(F\\) (which satisfies the properties) there is an associated finite unique Borel measure, and from that unique Borel measure we can construct an associated R.V. which obeys that law. Unfortunately, even though it is finite and thus \\(\\sigma\\)-finite, it is not necessarily absolutely continuous and we can thus not always find an associated pdf.</p>
<p>It turns out that the idea that we can associate to a CDF a RV is useful for simulating random variables with a specified distribution. The idea is to generate \\(U \\sim \\mathcal U(0,1)\\) and then generate \\(X \\sim  F_X^{-1}(U)\\). This, of course, requires a closed-form expression for \\(F^{-1}\\), which is not always so trivial. (see <strong>simulation via CDF</strong>) https://data140.org/textbook/content/chapter-16/simulation-via-the-cdf/. One way to do generate normal \\((\\mu, \\sigma^2)\\) R.V. is by starting from \\(U \\sim \\mathcal U(0,1)\\) and apply \\(Z= \\Phi^{-1}(U)\\) which has standard normal distribution, and finally let \\(X = \\sigma Z + \\mu\\).</p>
<div class="card card-ex"><div class="card-label">Exercise 7.5</div><p>Prove Remark 3 above by considering the Borel sets on \\([0,1]\\) with \\(\\nu\\) being Lebesgue measure and \\(\\mu\\) being counting measure. \\(\\mu\\) is not \\(\\sigma\\)-finite (see earlier lecture notes). Lebesgue measure is also absolutely continuous wrt to counting measure (only set which is zero for counting measure is emptyset).  Sps for contradiction that an \\(f_0 \\geq 0\\) exists s.t. \\[\\nu(A) = \\int_A f_0 d\\mu\\] where integrating against counting measure is simply \\[=\\sum_{x\\in A} f_0(x)\\]. For singletons we have \\(\\nu(\\{x\\}) = 0 = \\sum_{y \\in \\{x\\}} f_0(y)= f_0(x) = f_0(x)\\) but this implies \\(f_0(x) = 0 \\forall x\\) and thus \\(\\nu([0,1]) = m([0,1]) = 1 \\neq \\sum_{x\\in[0,1]} 0 =0\\)</p></div>
<h4>Proof of Radon-Nikodym's theorem</h4>
<p>We prove this under the assumption that \\(\\mu, \\nu\\) are finite, and only outline the extension to the \\(\\sigma\\)-finite case. First define \\[\\mathcal F := \\{f: X \\rightarrow [0, \\infty):\\int_A f(x) d\\mu(x) \\leq \\nu(A) \\forall A \\in \\mathcal M\\}\\] Note that \\(\\mathcal F\\) is nonempty since \\(f \\equiv 0\\) is in \\(\\mathcal F\\). Therefore, the supremum is defined, and we let \\[m:=\\sup \\{ \\int f(x) d\\mu(x) : f\\in \\mathcal F\\}\\]where \\(m\\leq \\nu(X) < \\infty\\).</p>
<p><strong>Claim:</strong> There exists \\(f_0 \\in \\mathcal F\\) for which \\(\\int f_0(x) d\\mu(x) = m\\), i.e. the supremum is achieved.</p>
<p>Note that if \\(h_1, h_2 \\in \\mathcal F\\), then so does \\(\\max\\{h_1, h_2\\}\\), since \\[\\int_A \\max\\{h_1, h_2\\} d\\mu(x) = \\int_{A \\cap \\{h_1 \\geq h_2\\}} h_1(x) d\\mu(x) + \\int_{A \\cap \\{h_1 < h_2\\}} h_2(x) d\\mu(x) \\leq \\nu(A \\cap \\{h_1 \\geq h_2\\}) + \\nu(A \\cap \\{h_1 > h_2\\}) = \\nu(A)\\]Now we choose \\(h_1, h_2, ... \\in \\mathcal F\\) so that \\[\\lim_{n\\rightarrow \\infty} \\int h_n(x) d\\mu(x) = m \\tag{2}\\]<strong>Why can we do this?</strong> Well, by the definition of the supremum, for every \\(\\epsilon > 0\\) there exists some \\(f\\in \\mathcal F\\) with \\(\\int f d\\mu > m -\\epsilon\\), we may thus take \\(\\epsilon = 1/n\\) to construct our sequence \\(h_n \\in \\mathcal F\\).</p>
<p>If we let \\(g_n:= \\max\\{h_1,...,h_n\\}\\), then each \\(g_n \\in \\mathcal F\\) (by induction) and \\(g_n\\) is increasing and \\[\\int h_n(x) d\\mu(x) \\leq \\int g_n d\\mu \\leq m\\] where the left inequality holds since \\(g_n \\geq h_n\\) by definition. The right inequality holds because \\(g_n \\in \\mathcal F\\) and thus \\(\\int g_n d\\mu \\leq m\\) by definition of m. By the squeeze theorem of (2), we thus have</p>
<p>\\[\\lim_{n\\rightarrow \\infty} \\int g_n d\\mu  = m\\]</p>
<p>If we can move \\(\\lim_{n\\rightarrow \\infty}\\) inside the integral, we have found our \\(f_0\\). In particular, by setting \\(f_0 := \\lim_{n\\rightarrow \\infty} g_n\\). Are we allowed to make this exchange of limiting operations? Well clearly the \\(g_n\\)'s form a sequence of nonnegative increasing measurable functions (being the maximum of elements in \\(\\mathcal F\\)) which allows us to apply MCT \\[\\int f_0(x) d\\mu(x) = m\\]What remains to show for the claim is that \\(f_0 \\in \\mathcal F\\). For this, fix \\(A \\in \\mathcal A\\). We want to apply MCT to \\(g_n 1_A\\) whose limit is given by \\(f_0 1_A\\) and thus we have \\[\\int_A f_0 d\\mu =  \\int f_0 1_A d\\mu = \\lim_{n\\rightarrow \\infty} \\int g_n 1_A d\\mu = \\lim_{n\\rightarrow \\infty} \\int_A g_n d\\mu\\] but since every \\(g_n \\in \\mathcal F\\), for every \\(n\\) we have \\[\\int_A g_n d\\mu \\leq \\nu(A)\\] and thus taking the limit we still have \\[\\int_A f_0 d\\mu = \\lim_{n\\rightarrow \\infty} \\int_A g_n d\\mu \\leq \\nu(A)\\]Which proves the claim.</p>
<p>Now we define \\[\\nu_0 := \\nu - f_0 \\mu\\]and our goal is to show that it is the zero measure, meaning that \\(\\nu_0(A) = 0 \\forall A \\in \\mathcal M\\). Note that by construction of \\(f_0\\), we have \\(\\nu_0(A) \\geq 0\\).</p>
<p>By showing \\(\\nu_0(X) = 0\\) is true, and using the fact that \\(\\nu_0\\) is a positive measure by construction, we have \\(\\nu_0(A) = 0 \\forall A \\in \\mathcal M\\). Thus, from now on, assume for sake of contradiction that \\(\\nu_0(X) > 0\\). This is just a finite number, and since \\(\\mu\\) is finite by assumption, there exists an \\(\\epsilon > 0\\) so that \\[\\nu_0(X) - \\epsilon \\mu(X) > 0 \\tag{3}\\] Now let \\((P,N)\\) be the Hahn decomposition for the signed measure \\[\\nu_0 - \\epsilon \\mu\\]which is just the difference of two positive measures. This construction always exists, so far so good!</p>
<p>When constructing the Hahn decomposition, we either have \\(\\mu(P) = 0\\) or \\(\\mu(P) > 0\\), since \\(\\mu\\) is a measure. We will see that both cases leads to a contradiction, assuming \\(\\nu_0(X) > 0\\) (or equivalently statement (3)).</p>
<p><strong>Case 1:</strong> \\(\\mu(P) = 0\\), then since \\(\\nu << \\mu\\) we have that \\(\\nu(P) = 0\\) and hence \\((\\nu_0 - \\epsilon \\mu)(P) = (\\nu - f_0 \\mu - \\epsilon \\mu)(P) = 0\\), contradicting (3) since \\[(\\nu_0 - \\epsilon \\mu)(X) = (\\nu_0 - \\epsilon \\mu)(P) + (\\nu_0 - \\epsilon \\mu)(N) = (\\nu_0 - \\epsilon \\mu)(N)\\]but by the Hahn decomposition that is \\(\\leq 0\\) and not \\(>0\\).</p>
<p><strong>Case 2:</strong> \\(\\mu(P) > 0\\). Note that \\[g_0 = f_0 + \\epsilon 1_P \\in \\mathcal F\\]As follows from\\[\\int_A (f_0 + \\epsilon 1_p) d\\mu(x) = \\int_A f_0 d\\mu(x) + \\epsilon \\mu(P \\cap A) \\leq \\int_A f_0 d\\mu(x) + \\nu_0(P \\cap A) \\leq \\int_A f_0 d\\mu(x) + \\nu_0(A) = \\nu(A)\\] where we used that \\(\\nu_0(P \\cap A) \\geq \\epsilon \\mu(P\\cap A)\\) since \\(P \\cap A \\subseteq P\\) is a positive subset and similarly \\(\\nu_0(P \\cap A) \\leq \\nu_0(A)\\) by monotonicity (with \\(\\nu_0\\) being a positive measure).</p>
<p>Next, since \\(\\mu(P) > 0\\) we have \\[\\int g_0 d\\mu(x) = m + \\epsilon \\mu(P) > m\\]contradicting the definition of \\(m\\), since \\(g_0 \\in \\mathcal F\\). Hence \\(\\nu_0\\) is the zero measure.</p>
<p><strong>Outline for the \\(\\sigma\\)-finite extension:</strong></p>
<ul><li>Break up \\(X\\) into countably many pieces, each piece with finite \\(\\mu, \\nu\\) measure. Then one can do the above on each piece separately and put it together in the end.</li></ul>

<h4>Example with KL divergence</h4>
<p>When training normalizing flows, we minimize the KL-divergence between our target distribution and our diffeomorphically transformed base distribution. In general, if we have some measurable space \\((\\Omega, \\mathcal T)\\) and two measures \\(\\mu, \\nu\\) where \\(\\mu << \\nu\\), the KL divergence is defined by \\[KL(\\mu || \\nu ) = \\int \\log\\frac{d\\mu}{d\\nu} d\\mu\\] where \\(\\frac{{d\\mu}}{d\\nu}\\) is the Radon-Nikodym derivative of \\(\\mu\\) wrt to \\(\\nu\\). If \\(\\mu \\not \\ll \\nu\\), then KL is set to \\(+\\infty\\) by convention.  See here https://jmlr.org/papers/volume25/24-0605/24-0605.pdf</p>
<p>If \\(\\mu, \\nu << m\\) with \\(m\\) being the Lebesgue measure, we have \\(d\\mu/d\\nu = d\\mu/dm / d\\nu/dm = p/q\\) which we interpret as the pdf's \\(p\\) and \\(q\\) respectively, and \\(d\\mu = p(x) dm(x)\\) and we therefore arrive at the usual KL divergence upon substitution.</p>
<div class="card card-thm"><div class="card-label">Theorem 7.9. (Lebesgue Decomposition Theorem)</div></div>
<p>The decompositions is relate to the measure \\(\\mu\\). The measure is split into an absolutely continuous part, which can be written as \\(f_0 \\mu\\) for some \\(f_0\\) by Radon-Nikodyn, and one singular component to which \\(\\mu\\) is "blind to".</p>
<p>We mention some other important but simple decompositions. Given any \\(\\sigma\\)-finite mesure space \\((X, \\mathcal M, \\mu)\\) with single points being measurable, we can decompose \\(\\mu\\) into an atomic peice and continuous piece. If \\(\\mathcal A\\) is the set of atoms, we write \\[\\mu = \\mu\\vert_{A} + \\mu\\vert_{A^c}\\]and it is easy to check that these are mutually singular.</p>
<div class="card card-thm"><div class="card-label">Proposition 7.10. (Measure-theoretic analogue of \\(\\epsilon-\\delta\\) continuity)</div><p><strong>Proof:</strong> \\(\\Rightarrow :\\) Assume the \\(\\epsilon-\\delta\\) condition. Suppose \\(\\mu(A) = 0\\). Fix \\(\\epsilon > 0\\). By the condition, we have that \\(\\mu(A) < \\delta\\) implies \\(\\nu(A) < \\epsilon\\). Since \\(\\mu(A) = 0 < \\delta\\) we have \\(\\nu(A) < \\epsilon\\). Since \\(\\epsilon > 0\\) arbitrary and \\(\\nu(A) \\geq 0\\) we have \\(\\nu(A) = 0\\). \\(\\Leftarrow:\\) We prove the contrapositive argument. If the \\(\\epsilon-\\delta\\) condtion fails, we have \\(\\nu \\not\\ll \\mu\\). If it fails, it means \\(\\exists \\epsilon_0 > 0\\) and sets \\((A_n)\\) with \\(\\mu(A_n) < 1/2^n\\) and \\(\\nu(A_n) \\geq \\epsilon_0\\). Now consider \\(A = \\limsup A_n\\). Borel Cantelli says that \\(\\mu(A) = 0\\). On the other hand, \\(\\nu(A) \\geq \\epsilon_0\\) since for every n \\(\\nu(\\bigcup_{k\\geq n} A_k) \\geq \\epsilon_0\\) and taking limit as \\(n\\rightarrow \\infty\\) and using continuity from above for \\(\\nu\\) (valid since \\(\\nu\\) is finite measure) we have that \\(\\nu \\not \\ll \\mu\\).</p></div>
<p>This is the measure-theoretic analogue of \\(\\epsilon-\\delta\\) continuity, where the role of distance bw points is replaced by \\(\\mu\\) and the distance between function values is played by \\(\\nu(A)\\). So the propositoin \\(\\nu << \\mu\\) is equivalent to \\(\\nu\\) being continuous with respect to \\(\\mu\\).</p>
<h4>What is happening on \\((R, \\mathcal B)\\)?</h4>
<div class="card card-thm"><div class="card-label">Three-part decomposition of measure on \\((R, \\mathcal B)\\) wrt to Lebesgue measure.</div></div>
<p>For the above theorem, compact sets in \\(R\\) are both closed and bounded. Clearly the Lebesgue measure is finite on compact sets. Taking inspiration from exercise 7.7 in Chapter 7 we have that  \\[\\mu = \\frac{2}{3}\\delta_{-7} + 100\\delta_4 + 3\\delta_{5.5} + (x^2) m|_{[4,6]}\\] which is a measure compact on finite sets can be decomposed into an atomic part \\(\\nu_d =  \\frac{2}{3}\\delta_{-7} + 100\\delta_4 + 3\\delta_{5.5}\\) and an absolutely continuous part \\(x^2 m|_{[4,6]}\\) with Radon-Nikodym derivative \\(x^2 1_{[4,6]}\\).</p>
<p>In elementary probability courses, distributions of RVs either have an atomic part or an absolutely continuous part (called discrete and continuous random variables respectively). But there is a third type that fits neither. The Cantor measure is of this form, which has a continuous singular piece which would amount to random variables which are continuous (no atoms) but which do not possess a probability density function (wrt to Lebesgue measure). Absolute continuity is necessary condition for a pdf to exist, and in this case \\(\\mu_c \\not \\ll m\\) since \\(\\mu_C(C) = 1\\) but \\(m(C) = 0\\). Thus we may take \\[\\mu = \\frac{2}{3}\\delta_{-7} + 100\\delta_4 + 3\\delta_{5.5} + (x^2) m|_{[4,6]} + \\mu_C\\]which contains both an atomic part, an absolutely continuous part and a part mutually singular wrt to Lebesgue measure.</p>

  html:`
<p>We now start a new chapter which will study differentiation in \\(\\mathbb R^n\\). In the mid 19th century, mathematicians were attempting to prove that continuous functions must be differentiable at some point. Then entered the Weierstrass function (continuous nowhere differentiable function). Most continuous functions are in fact nowhere differentiable in two senses.</p>
<ol><li>Topological sense: set of nowhere differentiable functions contains a dense \\(G_\\delta\\)</li><li>Measure-theoretic (or probabilistic) sense: natural probability measure on the space of continuous functions known as Brownian motion, and it is the case that almost every function with respect to this measure is nowhere differentiable.</li></ol>
<div class="card card-thm"><div class="card-label">Simple theorem.</div><p>[!CARD] The fundamental theorem of calculus [!theorem] First fundamental theorem of calculus: if \\(f\\) is a continous function on \\([a,b]\\)d \\[F(x) = \\int_a^x f(t) dt\\] then \\[F'(x) = x \\forall x.\\] Second fundamental theorem of calculus: If \\(f\\) is a continuously differentiable function on \\([a,b]\\) then \\[\\int_a^b f'(x) dx = f(b) - f(a)\\]</p></div>
<p>We first discuss the first fundamental theorem, and argue that it cannot possibly hold for all measurable bounded functions. If \\(f\\) is continuous function and \\(g\\) any <em>measurable function</em> which agrees with \\(f\\) a.e., then we have \\[\\int_a^x f(t) dt = \\int_a^x g(t) dt\\]for every \\(x\\), hence for every \\(x\\) we have \\[\\left( \\int_a^x g(t) dt\\right)'(x) = f(x)\\] and therefore \\[\\left( \\int_a^x g(t) dt\\right)'(x) = g(x)\\]will fail at every point where \\(f(x) \\neq g(x)\\). However, we do have  \\[\\left( \\int_a^x g(t) dt\\right)'(x) = g(x) \\ \\mathrm{a.e.}\\]So the most we can hope for a bounded measurable \\(f\\) is that the first fundamental theorem holds at a.e. \\(x\\). We will show this and generalize it to higher dimensions, which we will be called Lebesgue's differentiation theorem.</p>
<p>Note that continuous functions are also measurable. To see this, take \\(U \\subseteq \\mathbb R\\) then \\[f^{-1}(U)\\]must be open by continuity. And since open sets in \\([a,b]\\) are Borel sets. Since the Borel algebra is generated by all open sets of the real line, we have that the preimage of any Borel set is also in \\(\\mathcal B_{[a,b]}\\) so \\(f\\) is measurable. But not every measurable function is continuous.</p>
<div class="card card-remark"><div class="card-label">Explain how the FFTOC needs to change when allowing \\(f\\) to be bounded measurable instead of continuous.</div><p>We want to generalize the first FTOC to state it for general bounded measurable functions \\(f\\). We arrive at the conclusion that \\(F'(x) =f(x)\\) for a.e. \\(x\\) instead. In a sense, by forcing \\(f\\) to be continuous, we are picking out a unique element of the equivalence class formed by all measurable functions differing only by a nullset.  [!CARD] Give an example for when the SFTOC fails. Take \\(f\\) to be the Cantor ternary function, which we know has derivative lebesgue a.e. \\(0\\), and thus \\[0 = F_c(1)-F_c(0) = 1\\]which is a contradiction. It turns out that when it holds is connect to the concept of absolute continuity. In fact, for it to hold we would need \\(f\\) to be absolutely continuous on \\([a,b]\\), which is to say, loosely speaking, that \\(f\\) can not climb on sets of measure zero (which is precisely what the Cantor function does).</p></div>
<h4>Approximations by sets and by continuous functions</h4>
<p>The Borel \\(\\sigma\\)-algebra on \\(\\mathbb R^n\\), denoted by \\(\\mathcal B^n\\) can be described as generated by open sets in \\(\\mathbb R^n\\) or as the product \\(\\sigma\\)-algebra coming from \\((\\mathbb R, \\mathcal B)\\).</p>
<div class="card card-thm"><div class="card-label">Let \\(m\\) be the Lebesgue on \\(\\mathbb R^n\\).</div><ol><li>For any Borel set \\(E \\subseteq \\mathbb R^n\\) we have \\[m(E) = \\sup\\{ m(K) : K \\subseteq E, K \\mathrm{compact}\\}\\]</li><li>If \\(f\\in L^1(\\mathbb R^n, \\mathcal B^n, m)\\) and \\(\\epsilon > 0\\), then there exists a continuous function \\(g\\) on \\(\\mathbb R^n\\) so that \\[\\int_{\\mathbb R^n} |f(x) - g(x)| dm(x) < \\epsilon\\]</li></ol></div>
<p>Theorem 8.3(i) is sometimes referred to as approximation from within by compact sets.</p>
<p>We will also need to approximate sets with respect to other measures.</p>
<div class="card card-def"><div class="card-label">Definition 8.4. Regular.</div></div>
<p>An example of a regular Borel measure is the Lebesgue measure. An example of a non-regular Borel measure is the counting measure.</p>
<div class="card card-def"><div class="card-label">Theorem 8.5. Approximating from outside using open sets.</div></div>
<p>Since the Lebesgue measure is also regular, it satisfies both outer regularity and inner regularity, meaning the measure can be approximated from the outside using open sets or from the inside using compact sets.</p>
<p>Since the counting measure is not regular, it fails the above theorem. Take for example \\(E = \\{0\\}\\), then \\(\\nu(E) = 1\\). But any open set containing \\(0\\) contains an interval \\((-\\epsilon, \\epsilon)\\), thus \\(\\nu(O) = \\infty\\). Note however that for inner regularity, we can simply take \\(K = \\{0\\}\\) which is compact (single points are compact), so the supremum is achieved.</p>
<div class="card card-remark"><div class="card-label">Give an example of a Borel measure which is regular, and one that is non-regular.</div><p>Regular: the Lebesgue measure. Non-regular: the counting measure.</p></div>
<h4>8.4 A covering lemma</h4>
<div class="card card-thm"><div class="card-label">Theorem 8.6. A simple covering lemma.</div></div>
<p><strong>Proof</strong> Let \\(B_1\\) be the largest of \\(A_1,...,A_k\\). Remove all remaining \\(A_i\\)'s which intersect \\(B_1\\). Let \\(B_2\\) be the largest of the remaining \\(A_i\\)'s. Remove all remaining \\(A_i\\)'s which intersect \\(B_2\\). Let \\(B_3\\) be largest of remaining ... and continue until no \\(A_j\\)'s are left. This produces \\(B_1, ..., B_l\\) which are disjoint by construction.</p>
<p>\`\`<code>jsx: <CoveringLemma /> </code>\`\`</p>
<p><strong>Claim</strong> If \\(A_i\\) is NOT in the final list, then for some \\(j\\) we have \\[A_i \\subseteq B_j^\\star\\] where \\(^\\star\\) denotes the ball concentric with \\(B_j\\) but three times the radius. Since \\(A_i\\) was not chosen, it must have intersected one of the \\(B_j\\)'s. The first \\(B_j\\) it intersects must be as large as \\(A_i\\) since otherwise we would have chosen \\(A_i\\) instead. We must therefore have \\[r(A_i) \\leq r(B_j)\\] and since they intersect, we have \\[d(\\mathrm{center}(A_i), \\mathrm{center}(B_j)) < r(A_i) + r(B_j)\\]Thus for any point \\(x\\in A_i\\) we have \\[d(x, \\mathrm{center}(B_j)) \\leq d(x, \\mathrm{center}(A_i)) + d(\\mathrm{center}(A_i), \\mathrm{center}(B_j)) < 2r(A_i) + r(B_j) < 3r(B_j)\\] You can think of this as three contributions depending on</p>
<p>\`\`<code>jsx: <CoveringFactor/> </code>\`\`</p>
<p>In the case where \\(A_i\\) was selected, then \\(A_i = B_j\\) for some j, then \\(B_j \\subseteq B_j^\\star\\) trivially. But if it was eliminated, we had that \\(A_i \\subseteq B_j^\\star\\), so every \\(A_i\\) is contained in <em>some</em> \\(B_j^\\star\\), meaning \\[\\bigcup_i A_i \\subseteq \\bigcup_j B_j^\\star\\]</p>
<p>We thus obtain, by applying monotonicity and countable subadditivity \\[m(\\bigcup_{i=1}^k A_i) \\leq m(\\bigcup_{j=1}^l B_j^\\star) \\leq \\sum_{j=1}^l m(B_j^\\star) = 9 \\sum_{j=1}^l m(B_j)\\] as desired.</p>
<div class="card card-thm"><div class="card-label">Theorem 8.7. A covering lemma.</div></div>
<p>Before constructing the proof, we notice two differences between this covering lemma and the simpler covering lemma. First of all, there is no assumption about the collection \\(\\mathcal C\\) being finite. The conclusion is about \\(c\\) and not \\(m(U)\\) too.</p>
<p>Since \\(c < m(U)\\), by theorem 8.3(i) we can choose \\(K \\subseteq U\\) compact s.t. \\(m(K) > c\\). A compact set has finite subcover, meaning we can take \\(A_1,...,A_m \\in \\mathcal C\\) that cover \\(K\\). Now we repeat the same steps as before, choosing \\(B_1\\) being among those of maximal size, then choose \\(B_2\\) among these to have maximal size but disjoint from \\(B_1\\), and repeating. The claim is identical as before, meaning if \\(A_i\\) is NOT in the final list, then for some \\(j\\) we have \\[A_i \\subseteq B_j^\\star\\] where \\(^\\star\\) denotes the ball concentric with \\(B_j\\) but three times the radius. Since \\(A_i\\) was not chosen, it must have intersected one of the \\(B_j\\)'s. Unlike before however, the measure is bounded by a factor of \\(3^n\\) instead. \\[c < m(K) < m(\\bigcup_{j=1}^k B_j^\\star) \\leq \\sum_{j=1}^k m(B_j^\\star) = 3^n \\sum_{j=1}^k m(B_j)\\] as desired.</p>
<hr class="lecture-sep">
<p>In what follows, we will denote \\(B(x,r)\\) the open ball centered at \\(x\\) with radius \\(r\\).</p>
<div class="card card-def"><div class="card-label">Definition 8.8. Locally integrable.</div><p>[!CARD] What is the containment relationship between \\(L^1\\) and \\(L^1_\\mathrm{loc}\\)? Clearly if \\(f\\in L^1\\) then it is also in \\(L^1_\\mathrm{loc}\\) since \\[\\int_K |f| dm \\leq \\int_{\\mathbb R^n} |f| dm < \\infty\\]Thus \\[L^1(\\mathbb R^n) \\subseteq \\mathbb L^1_\\mathrm{loc}(\\mathbb R^n)\\] [!CARD] Give an example of a function not in \\(L^1\\) but in \\(L^1_\\mathrm{loc}\\). For example \\(f(x) = 1\\) on \\(\\mathbb R^1\\) is not in \\(L^1\\) but it is in \\(L^1_\\mathrm{loc}\\).</p></div>
<p>For \\(f\\in L_\\mathrm{loc}^1\\), \\(x\\in \\mathbb R^n\\), and \\(r > 0\\) we define \\[A_r f(x) = \\frac{1}{m(B(x,r))} \\int_{B(x,r)} f(y) dm(y)\\]which is simply the average of \\(f\\) over the ball around \\(x\\) with radius \\(r\\). This can be seen interpreted as the mean value of \\(f\\) over the ball centered around \\(x\\) with radius \\(r\\).</p>
<p>Some additional remarks:</p>
<ol><li>If \\(f\\) is continuous at \\(x\\), it is easy to see that \\[\\lim_{r\\rightarrow 0} A_r f(x) = f(x)\\]</li><li>This cannot occur for all \\(f\\) since if we modify it at a single point, it would fail there. Take for example \\(\\tilde f(x) =1\\) but \\(\\tilde f(y) = 0, y \\neq x\\), then the limit becomes \\(0\\) as \\(r\\rightarrow 0\\) whereas the LHS is \\(1\\).</li></ol>
<div class="card card-remark"><div class="card-label">Given \\[A_r f(x) = \\frac{1}{m(B(x,r))} \\int_{B(x,r)} f(y) dm(y)\\] what can we say about \\(\\lim_{r\\rightarrow 0 } A_rf(x)\\)?</div><p>If it is continuous we have \\(A_rf(x) = f(x)\\). But in general it is not true since we can modify \\(f\\) at a single point and arrive at a contradiction.  [!CARD] Definition 8.9. Hardy-Littlewood Maximal function.</p>
<div class="card card-def"><div class="card-label">If \\(f\\in L^1_\\mathrm{loc}(\\mathbb R^n)\\), then the Hardy-Littlewood maximal function \\(Hf\\) is defined by \\[Hf(x) := \\sup_{r> 0} A_r|f|(x)\\]</div></div>
<p>[!CARD] Show that the Hardy-Littlewood maximal function \\(Hf(x)\\) is a measurable function. Since \\((x,r) \\rightarrow A_r f(x)\\) is continuous in \\(r,x\\), it is also measurable, and the supremum over measurable functions is also measurable, and thus \\(Hf\\) is also measurable function.</p></div>
<p>This functions essentially computes the average over the absolute value of \\(f\\) over all radii, and picks the largest such average amongst those radii. It is therefore a "measure" of the local average of \\(|f|\\).</p>
<p>One can verify that \\(Hf\\) is a measurable function by noting  \\[(Hf)^{-1}(\\alpha, \\infty) =\\bigcup_{r>0} (A_r|f|)^{-1}\\{(\\alpha, \\infty)\\}\\]where \\(A_rf\\) is a continuous function for \\(f\\in L^1_\\mathrm{loc}\\), and thus we have preimages of open sets under continuous functions which are still continuous, and thus a union of open sets.</p>
<div class="card card-ex"><div class="card-label">Exercise 8.1. Verify that for \\(f\\in L^1(\\mathbb R^n)\\) we have that \\(\\forall x\\) the following \\[\\lim_{r\\rightarrow \\infty} A_r|f|(x)=0\\]</div><p>Solution: By definition we have that \\[\\lim_{r\\rightarrow \\infty} A_r|f|(x) = \\lim_{r\\rightarrow \\infty} \\frac{1}{m(B(x,r))} \\int_{B(x,r)} |f(y)| dm(y)\\]Now using the fact that \\(f\\in L^1\\) we have that \\[\\frac{1}{m(B(x,r))} \\int_{B(x,r)} |f(y)| dm(y) \\leq \\int_{\\mathbb R^n} |f(y)| dm(y)  < \\infty\\] for any \\(r > 0\\) and \\(x\\in\\mathbb R^n\\). We therefore have \\[0\\leq A_r|f|(x) \\leq \\frac{||f||_{L^1}}{\\omega_n r^n} \\rightarrow_{r\\rightarrow \\infty} 0\\] as desired by the squeeze theorem.</p></div>
<div class="card card-thm"><div class="card-label">Theorem 8.10. (Hardy-Littlewood Maximal Theorem).</div><details class="proof"><summary>Proof</summary><p>Let \\(E_\\alpha = \\{x: Hf(x) > \\alpha\\}\\).  For each \\(x\\in E_\\alpha\\) there exists \\(r_x > 0\\) so that \\[A_{r_x}|f|(x) > \\alpha\\] by the definition of the supremum. With this, we can for each \\(x\\) have an associated open ball, and we may denote this collection of open balls as \\(\\mathcal C\\). Given \\(c < m(\\bigcup_{x\\in E_a} B(r, r_x))\\), we can use the covering lemma from Lecture 12 - 3-times covering lemma to find \\(x_1, ..., x_k\\) in \\(E_\\alpha\\) so that \\(k\\) balls \\(\\{B(x_i, r_{x_i})\\}\\) are disjoint and \\[\\frac{c}{3^n} \\leq \\sum_{i=1}^k m(B(x_i, r_{x_i}))\\] However, by our choice of \\(r_x\\)'s, i.e. \\(A_{r_{x_i}}|f|(x_i) > \\alpha\\), we have \\[\\frac{c}{3^n} \\leq \\sum_{i=1}^k m(B(x_i, r_{x_i})) \\leq \\sum_{i=1}^k \\frac{1}{\\alpha}\\int_{B(x_i, r_{x_i})} |f|(x) dm(x) \\leq \\frac{1}{\\alpha} \\int |f|(x) dm(x)\\]where the last inequality follows from the disjointness of the balls. Since this holds \\(\\forall c < m(E_\\alpha)\\), we also have \\[m(E_\\alpha) \\leq \\frac{3^n}{\\alpha} \\int |f|dm\\] as desired.</p></details>
<p>[!CARD] What is the intuition behind the Hardy-Littlewood maximal theorem? It tells us that the worst-case local average can only be large at individual points, since as \\(\\alpha \\rightarrow \\infty\\) the RHS tends to zero. The theorem says that if \\(f\\in L^1\\), the total mass of \\(f\\) is finite, the theorem says you can't have large local averages everywhere, it has to be spread out.</p></div>
<hr class="lecture-sep">
<div class="card card-thm"><div class="card-label">Theorem 8.11. The differentiation theorem for functions.</div><details class="proof"><summary>Proof</summary><p>It suffices to show this a.e. point in \\([- N, N]^n\\). If it holds for every N, it also holds for the full \\(\\mathbb R^n\\) since countable union of nullset is still a nullset. Therefore we may assume \\(f\\) is 0 outside of \\([-N-1, N+1]^n\\) since we are anyways taking the limit as \\(r\\rightarrow 0\\) in the end, in which case we have that \\(f\\in L^1(\\mathbb R^n)\\). This will be needed when we apply Hardy-Littlewoods maximal theorem.  For any \\(\\alpha >  0\\) let \\[E_\\alpha = \\{ x : \\limsup_{r\\rightarrow 0} |A_rf(x) - f(x)| > \\alpha\\}\\]If we can show that \\(m(E_\\alpha)  =0\\) for each \\(\\alpha\\), then this implies the theorem since the set of points where the conclusion of the theorem fails is equal to \\(\\bigcup_n E_{1/n}\\) which then also has measure zero (which is just the definition of the statement being true a.e.)</p>
<p>It is not obvious a priori that \\(E_\\alpha\\) is Lebesgue measurable, however we will show it is contained inside a measurable sets of arbitrarily small measure, and its outer measure is thus zero and by completeness it will be Lebesgue measurable.</p>
<p>Now fix \\(\\alpha > 0\\) and show \\(m(E_\\alpha) = 0\\). Fix \\(\\epsilon > 0\\). By theorem 8.3 we can find a continuous integrable function \\(g\\) such that \\[\\int_{\\mathbb R^n} |f(x) -g(x)| dm(x) < \\epsilon\\] and thus\\(f-g \\in L^1(\\mathbb R^N\\)). Observe that \\[\\limsup_{r\\rightarrow 0}|A_r f(x) - f(x)| \\leq \\limsup_{r\\rightarrow 0}|A_r(f-g)(x)| + \\limsup_{r\\rightarrow 0}|A_rg(x) - g(x)| + \\limsup_{r\\rightarrow 0}|g(x) - f(x)|\\] by the triangle inequality. The first term is at most \\(H(f-g)(x)\\), and the second term is zero since the theorem is easily checked for continuous functions. Hence \\[\\limsup_{r\\rightarrow 0}|A_r f(x) - f(x)| \\leq H(f-g)(x) + |g(x)-f(x)|\\]If the first term is larger than \\(\\alpha\\), then at least one of the terms on the RHS have to be larger than \\(\\alpha/2\\), i.e. \\[E_\\alpha \\subseteq \\{x: H(f-g)(x) > \\alpha/2\\} \\cup \\{x: |g(x) - f(x)| > \\alpha/2\\}\\] which is the union of two measurable sets, being preimages of measurable functions of Borel sets, and thus the outer measure and Lebesgue measure agree (being measurable) Hence \\[m^\\star(E_\\alpha) \\leq m^\\star(U) = m(\\{x: H(f-g)(x) > \\alpha/2\\}) +m( \\{x: |g(x) - f(x)| > \\alpha/2\\})\\] Using theorem 8.10 for the first term and Markov's inequality for the second we obtain \\[m(E_\\alpha) \\leq \\frac{2)(3)^n}{\\alpha} \\epsilon + \\frac{2}{\\alpha}\\epsilon\\]And since \\(\\epsilon > 0\\) arbitrary and the outer measure of \\(E_\\alpha\\) is zero, and the measure space is complete, \\(E_\\alpha\\) is also Lebesgue measurable with measure \\(m(E_\\alpha) = 0\\).</p></details>
<p>[!CARD] Explain how the usual notion of derivative in 1 dimension comes about from the Lebesgue differentiation theorem. Take the ball \\(B(x,r) = (x-r, x+r)\\) has measure \\(2r\\), so \\[\\lim_{r\\rightarrow 0} A_r f(x) = \\frac{1}{2r}\\int_{x-r}^{x+r} f(y) dy = \\lim_{r\\rightarrow 0} \\frac{1}{2r}(F(x+r)-F(x-r)).\\]</p></div>
<p>What the above theorem tells us is that for any locally integrable function \\(f\\), one has for Lebesgue a.e. \\(x\\): \\[\\lim_{r\\to 0} \\frac{1}{m(B(x,r))} \\int_{B(x,r)} (f(y) - f(x))\\, dm(y) = 0\\]</p>
<p>This might be due to some cancellation. The following stronger result shows that this is not the case.</p>
<div class="card card-remark"><div class="card-label">Theorem 8.12: Lebesgue points</div><p>For any locally integrable function \\(f\\), one has for Lebesgue a.e. \\(x\\): \\[\\lim_{r\\to 0} \\frac{1}{m(B(x,r))} \\int_{B(x,r)} |f(y) - f(x)|\\, dm(y) = 0\\]</p>
<p>The set of \\(x\\) where this holds is called the <strong>Lebesgue set</strong> of \\(f\\), denoted \\(\\mathcal{L}_f\\).</p></div>
<p>The Lebesgue points of a function \\(f\\) are therefore interpreted as points where \\(f\\) does not oscillate too much, in an average sense. Finally, theorem 8.12 is a stronger version of theorem 8.11, and will allow us to replace balls by other types of sets (see corollary 8.14).</p>
<div class="card card-def"><div class="card-label">Definition 8.13: Shrinks Nicely</div><p>A collection of Borel sets \\(\\{E_r\\}_{0<r\\leq 1}\\) is said to <strong>shrink nicely</strong> to \\(x\\) if for all \\(r \\in (0,1]\\):</p>
<ol><li>\\(E_r \\subseteq B(x,r)\\)</li><li>There exists \\(\\alpha > 0\\) such that \\(m(E_r) \\geq \\alpha\\, m(B(x,r))\\) for all \\(r\\).</li></ol>
<p>The second condition says that each \\(E_r\\) occupies a substantial proportion of \\(B(x,r)\\). Note there is no requirement that \\(x \\in E_r\\). [!CARD] Give examples of sets which shrink nicely. Take the half-ball, which has \\(\\alpha = 1/2\\), a cube which has \\(\\alpha = (2/\\pi)^n\\), an annulus with \\(E_r = B(x,r) \\setminus B(x,r/2)\\) with \\(\\alpha = 1-1/2^n\\) etc... Note that the annulus does not contain \\(x\\). [!CARD] Give examples of nicely shrinking sets in \\(R^1\\) and how we can obtain variants of the difference quotient.SS</p>
<p>[!CARD]  Corollary 8.14: Lebesgue Points and Nicely Shrinking Sets</p>
<p>[!theorem] Let \\(f\\) be locally integrable. If \\(x \\in \\mathcal{L}_f\\) (and hence for \\(m\\)-a.e. \\(x\\)) and \\(\\{E_r\\}_{0<r\\leq 1}\\) are Borel sets shrinking nicely to \\(x\\), then: \\[\\lim_{r\\to 0} \\frac{1}{m(E_r)} \\int_{E_r} |f(y) - f(x)|\\, dm(y) = 0\\] and \\[\\lim_{r\\to 0} \\frac{1}{m(E_r)} \\int_{E_r} f(y)\\, dm(y) = f(x)\\]</p></div>
<p>As a special case if \\(f\\in L^1([0,1])\\) and letting \\(E_r(x) = [x, x+r]\\) one has \\[(\\int_0^x f(t) dm(t))'(x) =f(x)\\] for a.e. x.</p>
<div class="card card-thm"><div class="card-label">Theorem 8.15: Differentiation Theorem for Measures</div><p>\\[\\lim_{r\\to 0} \\frac{\\nu(B(x,r))}{m(B(x,r))}\\] exists and equals \\(f(x)\\) for Lebesgue a.e. \\(x\\).</p>
<p><strong>Remark:</strong> If \\(\\nu \\ll m\\), this reduces to Theorem 8.11.</p></div>
<p>The intuition for the above result is that \\(\\nu_s(N^c) = 0\\) and \\(m(N)=0\\) (by singularity), so \\(\\nu_s\\) puts all its mass on \\(N\\), which is a Lebesgue null set. Thus, the ratio tells us that if we zoom into the measure \\(\\nu\\) by looking at how much mass it puts in a tiny ball around \\(x\\), normalized by the volume, we recover the density \\(f\\) at almost every point.</p>
<p>It turns out we can generalize the above theorem to nicely shrinking sets.</p>
<div class="card card-thm"><div class="card-label">Corollary 8.16: Differentiation for Measures over Nicely Shrinking Sets</div><p>Let \\(\\nu\\) be a regular Borel measure on \\(\\mathbb{R}^n\\) whose Lebesgue decomposition with respect to Lebesgue measure is given by \\(\\nu = \\nu_s + fm\\). Then for Lebesgue a.e. \\(x\\), if \\(\\{E_r\\}_{0<r\\leq 1}\\) are Borel sets shrinking nicely to \\(x\\), then \\[\\lim_{r\\to 0} \\frac{\\nu(E_r)}{m(E_r)} = f(x)\\]</p>
<p>[!CARD] Theorem 9.1 Right continuous function has finite derivative. [!theorem] Let \\(F\\) be a right continuous increasing function on \\([0,1]\\). Then \\(F\\) has a finite derivative at Lebesgue a.e. \\(x\\).</p></div>
`

<div class="card card-def"><div class="card-label">Total variation, bounded variation and unbounded variation.</div><p>We say \\(f\\) is of bounded variation on \\([a,b]\\) if \\(TV_{[a,b]}f < \\infty\\) and of unbounded variation otherwise. [!CARD] State some remarks about the TV. (i) If \\(f\\) is monotonically increasing, then \\(TV_{[a,b]}(f) = f(b) - f(a)\\) (ii) \\(TV_{[a,b]}(-f) = TV_{[a,b]}(f)\\) (iii) If \\(f\\) is the indicator function of the rationals, then \\(f\\) is of unbounded variation on every (nontrivial) interval. [!exercise] Exercise 9.1 <strong>(a) Check the remarks above.</strong></p>
<p>(i) follows from the definition and using the result a telescoping sum, (ii) also follows from the definition and (iii) For any interval, the rationals and irrationals are dense. So we can choose the points to alternate bw rationals and irrationals. Then each term gives 1, and the sum becomes \\(n\\). Since we can do this for arbitrarily large \\(n\\) the supremum over all partitions is \\(\\infty\\).</p>
<p><strong>(b) If \\(f\\) has continuous derivative, then it is of bounded variation.</strong> For this, we use the mean value theorem which states that \\(|f(x_i) - f(x_{i-1})| = |f'(\\xi_i)|(x_i - x_{i-1})\\) for some \\(\\xi_i \\in (x_{i-1}, x_i)\\). Each term can be bounded above by \\(\\sup_{x\\in[a,b]} |f'(x)| := M\\) since \\(f\\) has continuous derivative on a compact set, thus the whole sum is always bounded by \\(M(b-a) < \\infty\\).</p>
<p><strong>(c) If \\(f\\) is Lipschitz continuous, then it is of bounded variation.</strong> If \\(f\\) is Lipschitz continuous, then \\(|f(x_i) - f(x_{i-1})| \\leq C |x_i - x_{i-1}|\\) and so again the sum becomes bounded by \\(C(b-a)\\).  <strong>(d)</strong> <strong>Show that if f has a continuous derivative then \\[TV_{[a,b]} f= \\int_0^1 |f'(x)| dx\\]</strong> From the result in (b) we have already shown that \\(TV_{[a,b]} f \\leq \\int_a^b |f'(x)| dx\\) since we were able to show that \\(|f(x_i) - f(x_{i-1})| = |\\int_{x_{i-1}}^{x_i} f'(x) dx| \\leq \\int_{x_{i-1}}^{x_i}| f'(x)| dx\\), summing we get \\[\\sum_i^n |f(x_i) - f(x_{i-1})|  \\leq \\int_a^b |f'(x) dx\\]which after the supremum gives us the \\(\\leq\\) result. We are left with showing the \\(\\geq\\) part. Since \\(|f'|\\) is continuous, it is RI and thus the RI sums converge to the integral. For any \\(\\epsilon > 0\\) there exists a partition fine enough such that \\[\\sum_i |f'(\\xi_i)|(x_i - x_{i-1})| \\geq \\int_a^b |f'(x)| dx - \\epsilon\\]In particular we choose \\(\\xi_i\\) to be the one given by MVT and thus \\[sum_i |f'(\\xi_i)|(x_i - x_{i-1})| = \\sum_i^n |f(x_i) - f(x_{i-1})| \\leq TV_{[a,b]}(f)\\] which means \\[TV_{[a,b]}(f) \\geq \\int_a^b |f'(x)| dx - \\epsilon\\]And since \\(\\epsilon\\) arbitrary we are done.</p>
<p><strong>(e) Show that the continuous function \\(f(x) = x \\cos(\\pi/2x)\\) defined to be 0 at 0 is of unbounded variation on \\([0,1]\\) but of bounded variation on \\([\\epsilon, 1]\\) \\(\\forall \\epsilon > 0\\).</strong> We may construct the following partition \\(x_0 = 0, x_1 = 1/n, x_2 = /(n-1), ..., x_n = 1\\) then clearly whenever we evaluate two consecutive \\(\\cos(\\pi/2x_i)\\) and \\(\\cos(\\pi /2x_{i-1})\\), one of them will be 1 and the other zero. Thus we are effectively computing a partition of the form \\(\\sum_k x_{k} = \\sum 1/k\\) which we know diverges as we make the partition ever so finer. For the interval \\([\\epsilon, 1]\\), \\(f\\) has continuous derivative and thus by (b) it also has bounded variation.</p></div>
<div class="card card-remark"><div class="card-label">Give an example of a function with bounded and unbounded variation.</div><p>Take \\(f(x) = x \\cos(\\pi/2x)\\) on \\([0,1]\\) and \\([\\epsilon, 1]\\). In the latter, it has continuous derivative and thus it has also bounded variation. Another example of a function of unbounded variation is the indicator function on every nontrivial interval, or Brownian motion. [!CARD]  Theorem 9.3 \\(f\\) is of bounded variation iff...</p>
<div class="card card-thm"><div class="card-label">\\(f\\) is of bounded variation if and only if there exist increasing functions \\(g,h\\) so that \\(f = g-h\\)</div></div></div>
<p>There is a one-to-one correspondence between signed measures and right-continuous functions of bounded variation, which we discuss hereafter.</p>
<div class="card card-remark"><div class="card-label">Define the so-called Lebesgue-Stieltjes integral of a function \\(r\\) with respect to \\(f\\).</div><p>\\[\\int r(x) df(X) := \\int r(x) d\\mu_g(x) - \\int r(x) d\\mu_h(x)\\] where \\(g,h\\) are increasing and \\(\\mu_g, \\mu_h\\) are the measures associated to \\(g,h\\). If \\(f\\) is not of bounded variation, then \\(\\int r(x) df(x)\\) is not defined. When \\(f\\) is continuously differentiable, we also have \\[\\int r(x) df(x) = \\int r(x) f'(x) dx\\] [!CARD] Definition 9.4. Absolutely continuous function.</p>
<div class="card card-def"><div class="card-label">\\(f : [0,1] \\rightarrow \\mathbb{R}\\) is absolutely continuous if for all \\(\\epsilon > 0\\), there exists \\(\\delta > 0\\) so that if \\(0 \\leq x_1 < y_1 < x_2 < y_2 < \\ldots < x_n < y_n \\leq 1\\) and \\[\\sum_{i=1}^n (y_i - x_i) < \\delta\\], then \\[\\sum_{i=1}^n |f(y_i) - f(x_i)| < \\epsilon\\]</div></div>
<p>[!CARD] What is the intuition about absolute continuity, loosely speaking? Absolute continuity tells us that if the total length is small, then the total variation also has to be small. Since a nullset has arbitrarily small covers, the total variation of \\(f\\) over any nullset must be zero.</p>
<blockquote><p>The idea loosely speaking is that the function cannot increase on a set of measure zero. This is why the Cantor ternary function fails to be absolutely continuous.</p></blockquote>
<p>[!CARD] What is the relationship between continuity, uniform continuity and absolute continuity on compact intervals? Absolute continuity implies continuity (take \\(n=1\\) in the definition of absolute continuity) and hence uniform continuity on compact intervals.  [!CARD] Exercise 9.2 Show that the Cantor ternary function \\(f_C\\) is not absolutely continuous.</p>
<div class="card card-ex"><div class="card-label">For each \\(n\\), let \\([x_1, y_1], \\ldots, [x_{2^n}, y_{2^n}]\\) be the \\(2^n\\) closed intervals remaining at stage \\(n\\) of the Cantor set construction, ordered left to right. Then:</div><p>\\[\\sum_{i=1}^{2^n} (y_i - x_i) = \\left(\\frac{2}{3}\\right)^n \\to 0\\] so for large enough \\(n\\), the total length is less than any given \\(\\delta\\). However, since \\(f_C\\) is constant on each removed middle-third interval and monotone increasing, all variation of \\(f_C\\) occurs on the remaining intervals, giving: \\[\\sum_{i=1}^{2^n} |f_C(y_i) - f_C(x_i)| = f_C(1) - f_C(0) = 1\\] Taking \\(\\epsilon = 1/2\\), no matter how small \\(\\delta > 0\\) is, we can find \\(n\\) large enough so that the total length \\((2/3)^n < \\delta\\) yet the total variation equals \\(1 > \\epsilon\\). Therefore \\(f_C\\) is not absolutely continuous.</p></div>
<p>[!CARD] Proposition 9.5. Absolute continuity of a function.</p>
<div class="card card-thm"><div class="card-label">Let \\(f\\) be a nonnegative right-continuous increasing function on \\([0,1]\\) with \\(f(0) = 0\\). Then \\(f\\) is absolutely continuous if and only if \\(\\mu_f << m\\) where \\(m\\) is the Lebesgue measure.</div></div></div>
<p>This is consistent with the result for Cantor ternary function (which is n.n. right continuous and increasing). The corresponding Cantor ternary measure (which again is a unique finite Borel measure) where \\(\\mu_C(C) = 1\\) and \\(m(C) = 0\\) so clearly \\(\\mu_C\\) is not absolutely continuous wrt to \\(m\\). By contrapositive, \\(F_c\\) is therefore not absolutely continuous.</p>
<div class="card card-thm"><div class="card-label">Proposition 9.6. Absolute continuity implies bounded variation.</div></div>
<h4>The fundamental theorem of calculus</h4>
<p>If \\(f:[0,1] \\rightarrow \\mathbb R\\) is increasing, does \\[\\int_0^1 f'(x) dx = f(1) - f(0) ?\\] Recall that an increasing function has a derivative a.e (thm 9.1).</p>
<div class="card card-thm"><div class="card-label">The fundamental theorem of calculus for monotone increasing functions.</div><p>[!CARD] <strong>Theorem 9.8.</strong> Let \\(f\\) be a nonneg right-continuous monotone increasing function on \\([0,1]\\) with \\(f(0) = 0\\). Let \\(\\mu_f\\) be the associated measure on \\([0,1]\\) and consider the Lebesgue decomposition \\(\\mu_f = \\mu_s + \\mu_{ac}\\) with respect to Lebesgue measure. Then:</p>
<ol><li>The Radon-Nikodym derivative of \\(\\mu_{ac}\\) with respect to Lebesgue measure is given by \\(f'\\).</li></ol>
<ol><li>\\(\\mu_{ac}[0,1] = \\int_0^1 f'(x)\\, dx\\).</li></ol>
<ol><li>\\(f\\) is absolutely continuous if and only if \\(\\int_0^1 f'(x)\\, dx = f(1) - f(0)\\). (So the second FTC holds if and only if \\(f\\) is absolutely continuous.)</li></ol>
<ol><li>\\(\\mu_f\\) is singular if and only if \\(f'(x) = 0\\) a.e.</li></ol>
<p>[!CARD] Give an example of a singular measure. From theorem 9.8, we have that \\(\\mu_C\\) is singular iff \\(F'_C(x) = 0\\) lebesgue a.e., which we know is strue. So the Cantor measure is a singular measure.</p></div>

function App() {

  const contentRef = useRef(null);
  const topic = TOPICS.find(t=>t.id===tid)||TOPICS[0];

  useEffect(()=>{

      window.MathJax.typesetPromise([contentRef.current]).catch(()=>{});

  return h('div',{id:'app'},

    h('div',{className:'mobile-nav'},
      h('select',{value:tid, onChange:ev=>setTid(ev.target.value)},

    h('nav',{className:'sidebar'},

      )

    // Main content
