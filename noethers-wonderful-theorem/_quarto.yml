project:
  type: book
  output-dir: _book
  pre-render: _graph.py
  resources:
    - images/
    - lecture-graph.js

book:
  title: "Notes from Emmy Noether's Wonderful Theorem"
  site-url: "https://tresnjo.github.io/lecture-notes/noethers-wonderful-theorem/"
  subtitle: "Reading Notes"
  date: last-modified
  date-format: "MMMM D, YYYY"
  search: true

  navbar:
    background: "#4a2545"
    foreground: white

  sidebar:
    style: "docked"
    search: true

  chapters:
    - index.qmd
    - lecture-01.qmd
    - lecture-02.qmd

language:
  title-block-published: "Last edited"

format:
  html:
    respect-user-color-scheme: true
    theme:
      light: [flatly, custom.scss]
      dark:  [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 1
    smooth-scroll: true
    html-math-method: mathjax
    include-in-header: react-header.html
    callout-icon: false
    reference-location: margin
    citation-location: margin
    grid:
      sidebar-width: 260px
      body-width: 780px
      margin-width: 310px
      gutter-width: 1.8rem


execute:
  freeze: auto
